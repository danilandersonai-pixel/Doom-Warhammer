<style>
:root { color-scheme: dark; }
/* Ретро-стиль: пиксельный шрифт, жёсткие тени, без скруглений.
   Палитра: багровый, латунь, холодная сталь. */
:root {
  color-scheme: dark;
  --ink: #0c0606;        /* почти чёрный для контуров и теней */
  --bone: #f0e2c0;       /* основной текст */
  --brass: #e0b040;      /* латунь, акценты */
  --blood: #d02018;      /* здоровье, опасность */
  --steel: #7a9ad0;      /* броня */
  --panel: rgba(20, 8, 8, 0.82);
  --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
}

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #120606; color: var(--bone);
  font-family: var(--pixel);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
/* растягиваем маленькую картинку без размытия — квадратные пиксели */
#game canvas { image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 2px 2px 0 var(--ink); }

/* прицел из четырёх "пикселей" */
#crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#crosshair i { position: absolute; width: 4px; height: 4px; background: var(--bone); box-shadow: 1px 1px 0 var(--ink); }
#crosshair i:nth-child(1) { left: -2px; top: -10px; }
#crosshair i:nth-child(2) { left: -2px; top: 6px; }
#crosshair i:nth-child(3) { left: -10px; top: -2px; }
#crosshair i:nth-child(4) { left: 6px; top: -2px; }

#hitmarker {
  --c: var(--bone);
  position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
  opacity: 0; transform: rotate(45deg);
  background:
    linear-gradient(var(--c), var(--c)) center top / 4px 8px no-repeat,
    linear-gradient(var(--c), var(--c)) center bottom / 4px 8px no-repeat,
    linear-gradient(var(--c), var(--c)) left center / 8px 4px no-repeat,
    linear-gradient(var(--c), var(--c)) right center / 8px 4px no-repeat;
}
#hitmarker.show { animation: hit 0.18s steps(3); }
#hitmarker.kill { --c: var(--blood); }
#hitmarker.kill.show { animation: hit 0.3s steps(4); }
@keyframes hit { from { opacity: 1; transform: rotate(45deg) scale(1.4); } to { opacity: 0; transform: rotate(45deg) scale(1); } }

#damage {
  position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(200, 0, 0, 0.9) 100%);
}

#wave {
  position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  font-size: 14px; letter-spacing: 2px; text-align: center; color: var(--brass); white-space: nowrap;
}
#enemiesLeft { display: block; margin-top: 8px; font-size: 10px; color: var(--bone); }

#banner {
  position: absolute; top: 26%; left: 16px; right: 16px; text-align: center;
  font-size: clamp(22px, 6vw, 48px); line-height: 1.3; color: var(--brass);
  text-shadow: 4px 4px 0 #6a1010, 6px 6px 0 var(--ink);
  opacity: 0;
}
#banner.show { opacity: 1; animation: slam 0.25s steps(4); }
@keyframes slam { from { transform: scale(1.8); } to { transform: scale(1); } }

#boss { position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 34px); left: 50%; transform: translateX(-50%); width: min(60vw, 440px); text-align: center; }
#boss .label { font-size: 10px; color: #ff6a40; margin-bottom: 6px; }
#boss .bar { height: 12px; }
#bossFill { background: repeating-linear-gradient(90deg, #e02818 0 10px, #901008 10px 12px); }

/* Панель статуса внизу слева (десктоп) */
#stats {
  position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
  width: 300px; padding: 10px 12px; background: var(--panel);
  border: 3px solid #5a3a1a; box-shadow: inset 0 0 0 2px #2a1408, 4px 4px 0 var(--ink);
}
.row { display: flex; align-items: center; gap: 8px; }
.row + .row { margin-top: 8px; }
.icon { width: 14px; height: 14px; flex: none; box-shadow: 2px 2px 0 var(--ink); }
.icon.health { background: var(--blood); clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%); }
.icon.armor { background: var(--steel); clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); }
.lbl { width: 80px; font-size: 8px; }
.num { width: 46px; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 12px; background: #1a0a08; border: 2px solid var(--ink); }
.fill { height: 100%; width: 100%; transform-origin: left; }
.fill.health { background: repeating-linear-gradient(90deg, var(--blood) 0 8px, #7a1008 8px 10px); }
.fill.armor { background: repeating-linear-gradient(90deg, var(--steel) 0 8px, #3a4a6a 8px 10px); }

/* Патроны внизу справа */
#ammo {
  position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  padding: 10px 14px; background: var(--panel); text-align: right;
  border: 3px solid #5a3a1a; box-shadow: inset 0 0 0 2px #2a1408, 4px 4px 0 var(--ink);
  font-size: 32px; color: var(--brass);
}
#ammo .max { font-size: 14px; color: var(--bone); }
#ammo.low #ammoNum { color: var(--blood); animation: blink 0.5s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
#reloadHint { font-size: 8px; color: #ff8a50; min-height: 10px; margin-top: 6px; }

/* На телефоне панели уходят наверх — внизу пальцы и кнопки */
body.touch #stats { bottom: auto; top: max(10px, env(safe-area-inset-top)); width: 220px; padding: 6px 8px; }
body.touch #ammo { bottom: auto; top: max(10px, env(safe-area-inset-top)); font-size: 22px; padding: 6px 10px; }
body.touch .lbl { display: none; }
body.touch #wave { top: auto; bottom: 14px; font-size: 10px; }
body.touch #boss { top: calc(max(10px, env(safe-area-inset-top)) + 64px); }

/* ---------- Сенсорное управление ---------- */
#touch { position: fixed; inset: 0; }
#stickBase {
  position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 3px solid rgba(240, 200, 120, 0.4); background: rgba(0, 0, 0, 0.3);
  left: 110px; bottom: 60px; top: auto; opacity: 0.5; pointer-events: none;
}
#stickBase.active { opacity: 1; }
#stickKnob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(224, 176, 64, 0.6);
}
.tbtn {
  position: absolute; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 3px solid rgba(224, 176, 64, 0.7); background: rgba(80, 16, 10, 0.55);
  color: var(--bone); font-size: 9px; text-shadow: 2px 2px 0 var(--ink);
}
.tbtn.active { background: rgba(220, 70, 30, 0.75); }
#btnFire { width: 96px; height: 96px; right: max(28px, env(safe-area-inset-right)); bottom: 40px; font-size: 10px; }
#btnMelee { width: 66px; height: 66px; right: calc(max(28px, env(safe-area-inset-right)) + 112px); bottom: 34px; }
#btnReload { width: 50px; height: 50px; right: calc(max(28px, env(safe-area-inset-right)) + 30px); bottom: 150px; font-size: 12px; }

/* ---------- Экраны ---------- */
.overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 16px; box-sizing: border-box; text-align: center;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 4px), /* "строки развёртки" */
    radial-gradient(ellipse at center, rgba(70, 14, 10, 0.85), rgba(8, 2, 2, 0.96));
}
.overlay h1 {
  margin: 0; font-size: clamp(22px, 6vw, 56px); line-height: 1.25; letter-spacing: 2px; font-weight: normal;
  color: var(--brass); text-shadow: 4px 4px 0 #8a1410, 8px 8px 0 var(--ink); text-wrap: balance;
}
.overlay p { max-width: 640px; margin: 0; font-size: 11px; line-height: 1.8; color: var(--bone); }
#controlsHelp { font-size: 9px; color: #b89a80; }
.overlay button {
  padding: 16px 32px; font-family: var(--pixel); font-size: 16px; cursor: pointer;
  color: var(--bone); background: #8a1a10; border: 0;
  box-shadow: inset -4px -4px 0 #4a0806, inset 4px 4px 0 #c84030, 4px 4px 0 var(--ink);
  text-shadow: 2px 2px 0 var(--ink);
}
.overlay button:hover, .overlay button:focus-visible { background: #a82214; outline: 3px solid var(--brass); outline-offset: 3px; }
.overlay button:active { transform: translate(2px, 2px); box-shadow: inset -4px -4px 0 #4a0806, inset 4px 4px 0 #c84030, 2px 2px 0 var(--ink); }

<script type="module">
import * as THREE from 'three';
// ===== collision.js =====
// Простейшая "физика": круги (игрок, враги) против прямоугольников (AABB) в плоскости XZ.
// Каждый коллайдер: { minX, maxX, minZ, maxZ, height }

// Выталкивает круг (pos.x, pos.z, radius) из всех коллайдеров
function resolveCircle(pos, radius, colliders) {
  for (const b of colliders) {
    const cx = Math.max(b.minX, Math.min(pos.x, b.maxX));
    const cz = Math.max(b.minZ, Math.min(pos.z, b.maxZ));
    const dx = pos.x - cx;
    const dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 >= radius * radius) continue;
    if (d2 > 1e-8) {
      // Обычный случай: сдвигаем от ближайшей точки коробки
      const d = Math.sqrt(d2);
      const push = radius - d;
      pos.x += (dx / d) * push;
      pos.z += (dz / d) * push;
    } else {
      // Центр оказался внутри коробки — выталкиваем через ближайшую сторону
      const left = pos.x - b.minX, right = b.maxX - pos.x;
      const front = pos.z - b.minZ, back = b.maxZ - pos.z;
      const m = Math.min(left, right, front, back);
      if (m === left) pos.x = b.minX - radius;
      else if (m === right) pos.x = b.maxX + radius;
      else if (m === front) pos.z = b.minZ - radius;
      else pos.z = b.maxZ + radius;
    }
  }
}

// Находится ли точка внутри какого-нибудь коллайдера (pad — запас по краям)
function pointInColliders(x, y, z, colliders, pad = 0) {
  for (const b of colliders) {
    if (x > b.minX - pad && x < b.maxX + pad && z > b.minZ - pad && z < b.maxZ + pad && y < b.height + pad) {
      return true;
    }
  }
  return false;
}

// ===== sprites.js =====
// Пиксельная графика, нарисованная кодом: спрайты врагов, кровь, куски, взрывы, огонь.
// Всё оригинальное — рисуем прямоугольниками на маленьком canvas, потом растягиваем без сглаживания.

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

// Текстура "без размытия" — пиксели остаются квадратными
function pixelTexture(c, repeat = false) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = repeat ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;
  t.generateMipmaps = repeat;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// Предсказуемый генератор случайных чисел — чтобы картинка всегда была одинаковой
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Тёмный контур в 1 пиксель вокруг непрозрачных пикселей — классика пиксель-арта
function outline(g, x0, y0, w, h, color = [12, 6, 6]) {
  const img = g.getImageData(x0, y0, w, h);
  const d = img.data;
  const a = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d[(y * w + x) * 4 + 3]);
  const mark = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (a(x, y) === 0 && (a(x - 1, y) || a(x + 1, y) || a(x, y - 1) || a(x, y + 1))) mark.push((y * w + x) * 4);
    }
  }
  for (const i of mark) { d[i] = color[0]; d[i + 1] = color[1]; d[i + 2] = color[2]; d[i + 3] = 255; }
  g.putImageData(img, x0, y0);
}

// Рисовалка: P(цвет, x, y, w, h) внутри кадра со смещением ox
function painter(g, ox) {
  return (c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(ox + x, y, w, h); };
}

// ---------- Враг ближнего боя: культист в рваном балахоне с серпом ----------
// Кадры: 0,1 — шаг; 2 — замах; 3 — удар
function drawCultist(P, f) {
  const robe = ['#2c0e0c', '#5a1a14', '#8a2c22'], skin = '#b08468', boot = '#1a1210';
  const blade = '#d0d0c8', bladeD = '#7a7a72';
  // ноги
  P(boot, f === 1 ? 7 : 8, 37, 4, 3);
  P(boot, f === 1 ? 14 : 13, 37, 4, 3);
  // балахон расширяется книзу
  for (let y = 13; y < 37; y++) {
    const w = Math.round(9 + ((y - 13) / 24) * 7);
    const x0 = 12 - Math.floor(w / 2);
    P(robe[1], x0, y, w);
    P(robe[2], x0, y, 2);
    P(robe[0], x0 + w - 3, y, 3);
  }
  P(robe[0], 11, 24, 1, 12);                  // складка
  for (let x = 6; x < 18; x += 3) P(robe[0], x, 36, 1, 1); // рваный край
  P('#a07a34', 8, 22, 9, 1);                  // верёвка-пояс
  P('#d0a040', 9, 23, 1, 3);
  // капюшон
  P(robe[1], 8, 4, 8, 10);
  P(robe[1], 9, 3, 6, 1);
  P(robe[2], 8, 5, 1, 8);
  P(robe[0], 15, 5, 1, 9);
  P('#100606', 10, 7, 5, 5);                  // темнота под капюшоном
  P('#ffd040', 11, 9); P('#ffd040', 13, 9);   // горящие глаза
  // левая рука
  P(robe[1], 5, 14, 3, 9);
  P(skin, 5, 23, 3, 2);
  // правая рука с серпом
  if (f === 2) {
    P(robe[1], 16, 5, 3, 9);
    P(skin, 16, 3, 3, 2);
    P(blade, 17, 0, 2, 3); P(blade, 19, 0, 3, 1); P(bladeD, 21, 1, 1, 2);
  } else if (f === 3) {
    P(robe[1], 16, 13, 4, 4);
    P(skin, 19, 16, 3, 2);
    for (let i = 0; i < 7; i++) P(i < 2 ? '#6a4a30' : blade, 20 - i, 18 + i, 2, 1);
  } else {
    P(robe[1], 16, 14, 3, 9);
    P(skin, 16, 23, 3, 2);
    P('#6a4a30', 17, 25, 1, 3);
    P(blade, 17, 28, 1, 7); P(blade, 18, 34, 3, 1); P(bladeD, 18, 28, 1, 6);
  }
}

// ---------- Стрелок: солдат-предатель в шлеме с винтовкой ----------
// Кадры: 0,1 — шаг; 2 — прицел; 3 — выстрел (вспышка)
function drawGunner(P, f) {
  const arm = ['#24281e', '#3e4634', '#5c6a4a'], cloth = '#3a2a22', boot = '#14100c';
  P(boot, f === 1 ? 7 : 8, 36, 5, 4);
  P(boot, f === 1 ? 15 : 14, 36, 5, 4);
  P(cloth, 8, 26, 4, 10); P(cloth, 14, 26, 4, 10);     // штаны
  P(arm[1], 7, 28, 5, 3); P(arm[1], 14, 28, 5, 3);      // наколенники
  P(arm[1], 7, 13, 12, 14);                              // броня торса
  P(arm[2], 7, 13, 2, 13); P(arm[0], 16, 13, 3, 14);
  P('#7a2a20', 7, 25, 12, 2);                            // пояс
  P(arm[1], 3, 12, 5, 5); P(arm[2], 3, 12, 5, 1);       // наплечники
  P(arm[1], 18, 12, 5, 5); P(arm[2], 18, 12, 5, 1);
  // шлем с зелёным визором
  P(arm[1], 9, 3, 8, 9); P(arm[2], 9, 3, 2, 8); P(arm[0], 15, 4, 2, 8);
  P('#0c100a', 10, 6, 6, 2); P('#70ff50', 10, 6, 2, 1); P('#70ff50', 14, 6, 2, 1);
  P(arm[0], 10, 10, 6, 2);                               // респиратор
  // винтовка у груди, ствол смотрит на игрока
  P(arm[1], 5, 17, 3, 6); P(arm[1], 18, 17, 3, 6);       // руки
  P('#1c1c1c', 6, 19, 14, 4); P('#4a4a4a', 6, 19, 14, 1);
  P('#2a2a2a', 11, 17, 4, 7); P('#101010', 12, 18, 2, 2); // дуло на нас
  P('#8a6a3a', 17, 22, 3, 4);                             // приклад
  if (f === 3) { // вспышка выстрела
    P('#a0ff60', 9, 14, 8, 8); P('#f0ffc0', 11, 16, 4, 4);
    P('#60e040', 12, 11, 2, 3); P('#60e040', 6, 17, 3, 2); P('#60e040', 17, 17, 3, 2);
  } else if (f === 2) {
    P('#60e040', 12, 18, 2, 2); // заряд светится
  }
}

// ---------- Чемпион: огромный рогатый воин в багровой броне ----------
// Кадры: 0,1 — шаг; 2 — замах когтем / прицел; 3 — выстрел
function drawChampion(P, f) {
  const r = ['#3a0a0a', '#6e1414', '#a02420', '#c84030'], b = ['#7a5a20', '#c09a40', '#f0d070'];
  const bone = '#d8ccb0', boneD = '#9a8c70';
  // ноги
  const lx = f === 1 ? 10 : 12, rx = f === 1 ? 26 : 24;
  P(r[1], lx, 40, 8, 14); P(r[2], lx, 40, 2, 14); P(r[0], lx, 54, 9, 6);
  P(r[1], rx, 40, 8, 14); P(r[0], rx + 6, 40, 2, 14); P(r[0], rx - 1, 54, 9, 6);
  P(b[1], lx, 46, 8, 2); P(b[1], rx, 46, 8, 2);
  // торс
  P(r[1], 9, 18, 26, 23); P(r[2], 9, 18, 4, 22); P(r[0], 30, 18, 5, 23);
  P(r[0], 15, 24, 14, 1); P(r[0], 15, 30, 14, 1);          // пластины
  P(b[1], 10, 38, 24, 3); P(b[2], 10, 38, 24, 1);          // золотой пояс
  P(bone, 19, 36, 6, 6); P('#1a0c0c', 20, 38, 1, 2); P('#1a0c0c', 23, 38, 1, 2); // костяная пряжка
  // огромные наплечники с шипами
  for (const [x, flip] of [[0, 0], [33, 1]]) {
    P(r[1], x, 14, 11, 10); P(r[2], x, 14, 11, 2); P(b[1], x, 23, 11, 2);
    P(boneD, x + (flip ? 7 : 2), 9, 2, 5); P(bone, x + (flip ? 7 : 2), 7, 1, 3);
  }
  // голова в шлеме и рога
  P(r[1], 16, 6, 12, 12); P(r[2], 16, 6, 3, 11); P(r[0], 25, 7, 3, 11);
  P('#0c0606', 18, 10, 8, 3); P('#90ff40', 18, 11, 3, 1); P('#90ff40', 23, 11, 3, 1);
  P(b[1], 19, 15, 6, 2);
  P(bone, 13, 2, 3, 6); P(bone, 12, 0, 2, 3); P(boneD, 15, 5, 1, 3);
  P(bone, 28, 2, 3, 6); P(bone, 30, 0, 2, 3); P(boneD, 28, 5, 1, 3);
  // левая рука — пушка
  P(r[1], 1, 24, 8, 12); P('#2a2a2a', 0, 34, 10, 10); P('#4a4a4a', 0, 34, 10, 2);
  P('#0c0c0c', 2, 40, 6, 4);
  if (f === 3) { P('#a0ff60', -1 + 1, 38, 10, 8); P('#f0ffc0', 3, 40, 4, 4); P('#60e040', 4, 46, 2, 3); }
  // правая рука — когти
  if (f === 2) {
    P(r[1], 35, 4, 8, 12); P(b[1], 35, 14, 8, 2);
    P(bone, 35, 0, 2, 4); P(bone, 38, 0, 2, 4); P(bone, 41, 1, 2, 4);
  } else {
    P(r[1], 35, 24, 8, 12); P(b[1], 35, 34, 8, 2);
    P(bone, 35, 36, 2, 6); P(bone, 38, 36, 2, 7); P(bone, 41, 36, 2, 6);
  }
}

const SPRITE_DEFS = {
  melee: { w: 24, h: 40, draw: drawCultist },
  ranged: { w: 26, h: 40, draw: drawGunner },
  boss: { w: 44, h: 60, draw: drawChampion },
};
const SPRITE_FRAMES = 4;

// Атлас: 4 кадра в ряд (с отступом в 2 пикселя для контура)
const atlasCache = {};
function enemyAtlas(type) {
  if (atlasCache[type]) return atlasCache[type];
  const def = SPRITE_DEFS[type];
  const fw = def.w + 2, fh = def.h + 2;
  const c = makeCanvas(fw * SPRITE_FRAMES, fh);
  const g = c.getContext('2d', { willReadFrequently: true });
  for (let f = 0; f < SPRITE_FRAMES; f++) {
    const P = painter(g, f * fw + 1);
    const P2 = (col, x, y, w, h) => P(col, x, y + 1, w, h); // сдвиг на 1 пиксель вниз для контура сверху
    def.draw(P2, f);
    outline(g, f * fw, 0, fw, fh);
  }
  atlasCache[type] = { canvas: c, frameW: fw, frameH: fh, aspect: fw / fh };
  return atlasCache[type];
}

// ---------- Куски (гибы): мясо, кость, броня ----------
function gibTextures() {
  const list = [];
  const shapes = [
    (P) => { P('#7a0a0a', 1, 2, 6, 4); P('#c01818', 2, 2, 4, 2); P('#e04040', 2, 2, 2, 1); P('#4a0404', 1, 5, 6, 1); },
    (P) => { P('#e8dcc0', 0, 3, 8, 2); P('#e8dcc0', 0, 2, 2, 4); P('#e8dcc0', 6, 2, 2, 4); P('#a09478', 1, 4, 6, 1); },
    (P) => { P('#5a1010', 1, 1, 5, 6); P('#9a2020', 2, 1, 3, 3); P('#c03030', 2, 2, 1, 1); },
    (P) => { P('#3e4634', 1, 2, 6, 4); P('#5c6a4a', 1, 2, 6, 1); P('#7a2a20', 1, 5, 6, 1); },
  ];
  for (const s of shapes) {
    const c = makeCanvas(10, 10);
    const g = c.getContext('2d', { willReadFrequently: true });
    s(painter(g, 1), 0);
    outline(g, 0, 0, 10, 10);
    list.push(pixelTexture(c));
  }
  return list;
}

// ---------- Лужи крови на полу ----------
function splatTextures(count = 4) {
  const list = [];
  for (let n = 0; n < count; n++) {
    const R = rng(100 + n);
    const s = 32, c = makeCanvas(s, s), g = c.getContext('2d');
    const blob = (cx, cy, r, col) => {
      g.fillStyle = col;
      for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) g.fillRect(cx + x, cy + y, 1, 1);
    };
    blob(16, 16, 7, '#6a0606');
    for (let i = 0; i < 10; i++) {
      const a = R() * Math.PI * 2, d = 5 + R() * 9;
      blob(Math.round(16 + Math.cos(a) * d), Math.round(16 + Math.sin(a) * d), 1 + Math.floor(R() * 3), '#6a0606');
    }
    blob(15, 15, 4, '#9a1010');
    blob(14, 14, 1, '#c82020');
    list.push(pixelTexture(c));
  }
  return list;
}

// ---------- Взрыв болта: 5 кадров ----------
function explosionAtlas() {
  const s = 24, frames = 5;
  const c = makeCanvas(s * frames, s), g = c.getContext('2d');
  const R = rng(7);
  for (let f = 0; f < frames; f++) {
    const ox = f * s, r = 3 + f * 2.2;
    for (let y = 0; y < s; y++) {
      for (let x = 0; x < s; x++) {
        const d = Math.hypot(x - 12 + 0.5, y - 12 + 0.5) + R() * 2;
        if (d > r) continue;
        const k = d / r + f * 0.18;
        let col = '#fff6c0';
        if (k > 0.35) col = '#ffd040';
        if (k > 0.6) col = '#ff7a10';
        if (k > 0.85) col = '#a02808';
        if (k > 1.05) col = (x + y) % 2 ? '#3a2a24' : null; // дым с дизерингом
        if (f >= 3 && R() < (f - 2) * 0.3) col = null;     // рассеивается
        if (!col) continue;
        g.fillStyle = col;
        g.fillRect(ox + x, y, 1, 1);
      }
    }
  }
  return { texture: pixelTexture(c), frames };
}

// ---------- Огонь жаровни: 4 кадра ----------
function fireAtlas() {
  const w = 16, h = 24, frames = 4;
  const c = makeCanvas(w * frames, h), g = c.getContext('2d');
  for (let f = 0; f < frames; f++) {
    const R = rng(30 + f);
    for (let y = 0; y < h; y++) {
      const t = y / h; // 0 сверху
      const half = Math.max(0, (t * 7) - (1 - t) * 1 + Math.sin(y * 0.7 + f * 1.6) * 1.5);
      for (let x = 0; x < w; x++) {
        const dx = Math.abs(x - 7.5);
        if (dx > half || R() < 0.08 * (1 - t)) continue;
        const k = dx / (half + 0.01) * 0.6 + (1 - t) * 0.6;
        g.fillStyle = k < 0.45 ? '#fff0a0' : k < 0.75 ? '#ffb020' : k < 1 ? '#ff5a10' : '#a01808';
        g.fillRect(f * w + x, y, 1, 1);
      }
    }
  }
  return { texture: pixelTexture(c), frames };
}

// ---------- Варп-снаряд врагов (зелёный) ----------
function plasmaTexture() {
  const s = 12, c = makeCanvas(s, s), g = c.getContext('2d');
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const d = Math.hypot(x - 5.5, y - 5.5);
    const col = d < 2 ? '#f0ffd0' : d < 3.5 ? '#90ff40' : d < 5 ? ((x + y) % 2 ? '#30a020' : null) : null;
    if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return pixelTexture(c);
}

// ---------- Вспышка выстрела оружия игрока ----------
function muzzleTexture() {
  const s = 32, c = makeCanvas(s, s), g = c.getContext('2d');
  const R = rng(3);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const dx = x - 15.5, dy = y - 15.5, d = Math.hypot(dx, dy);
    const ray = Math.abs(Math.sin(Math.atan2(dy, dx) * 4)) * 6;  // 8 лучей
    const lim = 7 + ray;
    if (d > lim || R() < 0.1) continue;
    const k = d / lim;
    g.fillStyle = k < 0.3 ? '#ffffff' : k < 0.55 ? '#fff080' : k < 0.8 ? '#ffa020' : '#ff5a08';
    g.fillRect(x, y, 1, 1);
  }
  return pixelTexture(c);
}

// ===== arena.js =====
// Арена 40×40 м в стиле ретро-шутера: пиксельные текстуры, витражи, знамёна, жаровни с огнём.
// Всё собрано из коробок и плоскостей, текстуры рисуются кодом (см. sprites.js).

const ARENA_HALF = 20;

// --- Пиксельные текстуры 64×64 ---
function tex(draw, seed, size = 64) {
  const c = makeCanvas(size, size);
  draw(c.getContext('2d'), size, rng(seed));
  return pixelTexture(c, true);
}
const px = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };

// Пол: тёсаные каменные плиты с фаской и трещинами
function drawFloor(g, s, R) {
  const tones = ['#3a3430', '#4a423c', '#564d45'];
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
    const x0 = tx * 32, y0 = ty * 32;
    px(g, tones[(tx + ty * 2 + 1) % 3], x0, y0, 32, 32);
    for (let i = 0; i < 70; i++) px(g, R() < 0.5 ? '#2e2824' : '#5e544a', x0 + 1 + R() * 30 | 0, y0 + 1 + R() * 30 | 0);
    px(g, '#6a6056', x0 + 1, y0 + 1, 30, 1); px(g, '#6a6056', x0 + 1, y0 + 1, 1, 30); // светлая фаска
    px(g, '#221c18', x0, y0 + 31, 32, 1); px(g, '#221c18', x0 + 31, y0, 1, 32);       // шов
  }
  // трещина
  let x = 10, y = 40;
  for (let i = 0; i < 14; i++) { px(g, '#1a1412', x, y); x += R() < 0.6 ? 1 : 0; y += R() < 0.7 ? 1 : -1; }
}

// Стены: крупная кладка с подсветкой граней и мхом
function drawBricks(g, s, R) {
  px(g, '#1e1a1c', 0, 0, s, s);
  for (let r = 0; r < 8; r++) {
    const off = (r % 2) * 8;
    for (let c = -1; c < 4; c++) {
      const x = c * 16 + off, y = r * 8;
      const base = ['#4a4448', '#544c50', '#3e3a3e'][(R() * 3) | 0];
      px(g, base, x + 1, y + 1, 15, 7);
      px(g, '#6a6266', x + 1, y + 1, 15, 1);
      px(g, '#2a2628', x + 1, y + 7, 15, 1);
      if (R() < 0.3) px(g, '#2e2a2c', x + 3 + R() * 10 | 0, y + 3, 2, 2);
    }
  }
  for (let i = 0; i < 25; i++) px(g, R() < 0.5 ? '#3a4a2a' : '#2a3820', R() * s | 0, 56 + R() * 8 | 0); // мох внизу
}

// Металл: клёпаные пластины с ржавчиной (ящики, жаровни)
function drawMetal(g, s, R) {
  px(g, '#3a3634', 0, 0, s, s);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const x = i * 32, y = j * 32;
    px(g, '#4a4440', x + 2, y + 2, 28, 28);
    px(g, '#5e5650', x + 2, y + 2, 28, 1);
    px(g, '#26221e', x + 2, y + 29, 28, 1);
    for (const [rx, ry] of [[4, 4], [26, 4], [4, 26], [26, 26]]) { px(g, '#7a7068', x + rx, y + ry, 2, 2); px(g, '#1e1a18', x + rx + 1, y + ry + 1); }
    for (let k = 0; k < 18; k++) px(g, R() < 0.5 ? '#6a3a1a' : '#4a2a14', x + 2 + R() * 28 | 0, y + 10 + R() * 20 | 0);
  }
  px(g, '#8a6a2a', 0, 30, s, 2); // латунная полоса
}

// Готическое окно-витраж со стрельчатой аркой (прозрачное вокруг)
function drawWindow(g, w, h) {
  const cx = w / 2;
  const inside = (x, y, inset) => {
    const r = cx - inset;
    if (y > h - 2 - inset || x < inset || x > w - inset) return false;
    if (y >= r * 1.2 + inset) return true;
    // стрельчатая арка из двух дуг
    const yy = r * 1.2 + inset - y;
    const d1 = Math.hypot(x - (inset + r * 1.6), yy), d2 = Math.hypot(x - (w - inset - r * 1.6), yy);
    return x < cx ? d1 < r * 1.6 : d2 < r * 1.6;
  };
  const R = rng(11);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!inside(x + 0.5, y + 0.5, 0)) continue;
    let c = '#2a2426';                                  // каменная рама
    if (inside(x + 0.5, y + 0.5, 2)) {
      // стекло: тёплые цвета, свинцовые переплёты
      const lead = x % 6 === 0 || y % 8 === 0 || Math.abs(x - cx + 0.5) < 0.6;
      const hue = ['#ff9a30', '#e05a20', '#ffd060', '#c03018', '#ff7a20'][(Math.floor(x / 6) + Math.floor(y / 8) * 3 + (R() < 0.1 ? 1 : 0)) % 5];
      c = lead ? '#1a1012' : hue;
    }
    px(g, c, x, y);
  }
}

// Знамя: багровое полотно, золотая кайма, простая эмблема-пламя, рваный низ
function drawBanner(g, w, h) {
  px(g, '#6a1010', 0, 0, w, h - 4);
  px(g, '#8a1a16', 2, 0, w - 4, h - 4);
  px(g, '#c09a40', 0, 0, w, 2);
  px(g, '#c09a40', 0, 0, 1, h - 4); px(g, '#c09a40', w - 1, 0, 1, h - 4);
  for (let x = 0; x < w; x += 4) px(g, '#6a1010', x, h - 4, 2, 2 + (x % 8 ? 2 : 0)); // бахрома
  // эмблема: пламя в ромбе
  const cx = w / 2 | 0, cy = h / 2 | 0;
  for (let y = -7; y <= 7; y++) { const k = 7 - Math.abs(y); px(g, '#c09a40', cx - k, cy + y, k * 2, 1); }
  for (let y = -5; y <= 5; y++) { const k = 5 - Math.abs(y); px(g, '#3a0808', cx - k, cy + y, k * 2, 1); }
  px(g, '#ffb020', cx - 1, cy - 3, 2, 6); px(g, '#ff6010', cx - 2, cy, 4, 3); px(g, '#fff0a0', cx - 1, cy + 1, 2, 1);
}

// Коробка с UV по размеру — текстура не растягивается на больших блоках
function boxGeo(w, h, d, texScale = 2) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, (uv.getX(k) * dims[f][0]) / texScale, (uv.getY(k) * dims[f][1]) / texScale);
  }
  return g;
}

function buildArena(scene) {
  const colliders = [];
  const solidMeshes = [];

  // --- Небо: багровое зарево у горизонта, ступенчатый градиент как в старых играх ---
  const FOG_COLOR = 0x4a1c18;
  scene.background = new THREE.Color(FOG_COLOR);
  const skyGeo = new THREE.SphereGeometry(100, 24, 16);
  const bands = [0xd0602a, 0x9a3420, 0x6a1c1a, 0x401018, 0x240a14, 0x12060c];
  const colors = [];
  const p = skyGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const h = Math.max(0, p.getY(i) / 100);
    const c = new THREE.Color(bands[Math.min(bands.length - 1, Math.floor(h * 9))]);
    colors.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
  scene.fog = new THREE.Fog(FOG_COLOR, 14, 70);

  // --- Свет: холодная "луна" + тёплые жаровни (ниже) ---
  scene.add(new THREE.HemisphereLight(0x9a8aa8, 0x2a1810, 1.1));
  const moon = new THREE.DirectionalLight(0x8aa0d8, 1.1);
  moon.position.set(-8, 20, 10);
  scene.add(moon);

  // --- Материалы ---
  const floorTex = tex(drawFloor, 1);
  floorTex.repeat.set(14, 14);
  const floorMat = new THREE.MeshLambertMaterial({ map: floorTex });
  const wallTex = tex(drawBricks, 2);
  const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
  const darkMat = new THREE.MeshLambertMaterial({ map: wallTex, color: 0x9a8a90 });
  const metalMat = new THREE.MeshLambertMaterial({ map: tex(drawMetal, 3) });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_HALF * 2, ARENA_HALF * 2), floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  solidMeshes.push(floor);

  function block(x, z, w, h, d, mat = wallMat, collide = true, y = 0) {
    const m = new THREE.Mesh(boxGeo(w, h, d), mat);
    m.position.set(x, y + h / 2, z);
    scene.add(m);
    if (collide) {
      solidMeshes.push(m);
      colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, height: y + h });
    }
    return m;
  }

  // --- Внешние стены ---
  const H = ARENA_HALF, WH = 8;
  block(0, -H - 0.5, H * 2 + 2, WH, 1);
  block(0, H + 0.5, H * 2 + 2, WH, 1);
  block(-H - 0.5, 0, 1, WH, H * 2);
  block(H + 0.5, 0, 1, WH, H * 2);

  // Контрфорсы с "шапками"
  for (let i = -16; i <= 16; i += 8) {
    for (const [x, z, w, d] of [[i, -H + 0.45, 1.4, 0.9], [i, H - 0.45, 1.4, 0.9], [-H + 0.45, i, 0.9, 1.4], [H - 0.45, i, 0.9, 1.4]]) {
      block(x, z, w, 9.5, d, darkMat);
      block(x, z, w + 0.3, 0.4, d + 0.3, metalMat, false, 9.5);
    }
  }

  // Зубцы — InstancedMesh (один вызов отрисовки)
  const merlons = [];
  for (let i = -19; i <= 19; i += 2.5) merlons.push([i, -H - 0.5], [i, H + 0.5], [-H - 0.5, i], [H + 0.5, i]);
  const merlonMesh = new THREE.InstancedMesh(boxGeo(1, 1.2, 1), darkMat, merlons.length);
  const mtx = new THREE.Matrix4();
  merlons.forEach(([x, z], i) => merlonMesh.setMatrixAt(i, mtx.makeTranslation(x, WH + 0.6, z)));
  scene.add(merlonMesh);

  // --- Витражи между контрфорсами (светятся сами — MeshBasic) ---
  const wc = makeCanvas(32, 64);
  drawWindow(wc.getContext('2d'), 32, 64);
  const winMat = new THREE.MeshBasicMaterial({ map: pixelTexture(wc), alphaTest: 0.5, side: THREE.DoubleSide, fog: false });
  const winGeo = new THREE.PlaneGeometry(2.6, 5.2);
  for (let i = -12; i <= 12; i += 8) {
    for (const [x, z, ry] of [[i, -H + 0.01, 0], [i, H - 0.01, Math.PI], [-H + 0.01, i, Math.PI / 2], [H - 0.01, i, -Math.PI / 2]]) {
      const m = new THREE.Mesh(winGeo, winMat);
      m.position.set(x, 4.2, z);
      m.rotation.y = ry;
      scene.add(m);
    }
  }

  // --- Шпили снаружи ---
  const spireMat = new THREE.MeshLambertMaterial({ color: 0x1a1214 });
  const cone = new THREE.ConeGeometry(1.8, 7, 4);
  for (const [x, z, h] of [[-24, -24, 18], [24, -24, 15], [-24, 24, 14], [24, 24, 19], [0, -32, 26], [-34, 4, 17], [33, -6, 21], [6, 33, 16]]) {
    block(x, z, 3.4, h, 3.4, spireMat, false);
    const c = new THREE.Mesh(cone, spireMat);
    c.position.set(x, h + 3.5, z);
    c.rotation.y = Math.PI / 4;
    scene.add(c);
  }

  // --- Укрытия ---
  block(0, 0, 3, 1.2, 3, darkMat);                   // алтарь
  block(0, 0, 2, 0.3, 2, metalMat, false, 1.2);
  block(-8, -8, 1.4, 6, 1.4);                         // колонны
  block(8, 8, 1.4, 6, 1.4);
  block(8, -8, 1.4, 2.2, 1.4);                        // разрушенные колонны
  block(-8, 8, 1.4, 2.6, 1.4);
  block(-12, 0, 0.8, 1.4, 6);
  block(12, 0, 0.8, 1.4, 6);
  block(0, -12, 6, 1.4, 0.8);
  block(0, 12, 6, 1.4, 0.8);
  block(-14, -12, 4, 3, 0.8);
  block(14, 12, 4, 3, 0.8);
  block(-14, 13, 0.8, 2.5, 4);
  block(14, -13, 0.8, 2.5, 4);
  block(-5, -15, 1.4, 1.4, 1.4, metalMat);            // ящики
  block(6, 15.5, 1.4, 1.4, 1.4, metalMat);
  block(16, -3, 1.4, 1.4, 1.4, metalMat);
  block(-16, 4, 1.4, 1.4, 1.4, metalMat);
  block(5, -5, 1.2, 1.0, 1.2, metalMat);

  // --- Знамёна на целых колоннах и обломках стен ---
  const bc = makeCanvas(20, 48);
  drawBanner(bc.getContext('2d'), 20, 48);
  const bannerMat = new THREE.MeshLambertMaterial({ map: pixelTexture(bc), alphaTest: 0.5, side: THREE.DoubleSide });
  const bannerGeo = new THREE.PlaneGeometry(1.1, 2.6);
  for (const [x, y, z, ry] of [[-8, 4.4, -7.28, 0], [8, 4.4, 8.72, 0], [-8, 4.4, -8.72, Math.PI], [8, 4.4, 7.28, Math.PI], [-14, 1.7, -11.58, 0], [14, 1.7, 12.42, 0]]) {
    const m = new THREE.Mesh(bannerGeo, bannerMat);
    m.position.set(x, y, z);
    m.rotation.y = ry;
    scene.add(m);
  }

  // --- Жаровни: чаша + анимированный огонь + мерцающий свет ---
  const fire = fireAtlas();
  const braziers = [];
  const bowlMat = metalMat;
  for (const [x, z] of [[-10.5, -10.5], [10.5, 10.5], [-10.5, 10.5], [10.5, -10.5]]) {
    block(x, z, 0.5, 0.9, 0.5, bowlMat);
    block(x, z, 1.0, 0.35, 1.0, bowlMat, false, 0.9);
    const map = fire.texture.clone();
    map.repeat.set(1 / fire.frames, 1);
    const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map, fog: false }));
    flame.scale.set(0.9, 1.35, 1);
    flame.position.set(x, 1.85, z);
    scene.add(flame);
    const light = new THREE.PointLight(0xff8a30, 18, 13, 1.6);
    light.position.set(x, 2.2, z);
    scene.add(light);
    braziers.push({ map, light, phase: Math.random() * 10 });
  }

  // Мусор на полу
  const rubble = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), darkMat, 40);
  const dummy = new THREE.Object3D();
  const R = rng(5);
  for (let i = 0; i < 40; i++) {
    const s = 0.15 + R() * 0.35;
    dummy.scale.set(s * (1 + R()), s, s * (1 + R()));
    dummy.position.set((R() - 0.5) * 38, s / 2 - 0.05, (R() - 0.5) * 38);
    dummy.rotation.set(R() * 0.5, R() * 3, R() * 0.5);
    dummy.updateMatrix();
    rubble.setMatrixAt(i, dummy.matrix);
  }
  scene.add(rubble);

  const spawnPoints = [
    [-17, -17], [0, -17.5], [17, -17], [17.5, 0], [17, 17], [0, 17.5], [-17, 17], [-17.5, 0],
    [-9, -17], [9, 17], [17, 9], [-17, -9],
  ].map(([x, z]) => new THREE.Vector3(x, 0, z));

  // Анимация огня: кадры сменяются 10 раз в секунду, свет мерцает
  function update(time) {
    for (const b of braziers) {
      const f = Math.floor(time * 10 + b.phase) % fire.frames;
      b.map.offset.x = f / fire.frames;
      b.light.intensity = 16 + Math.sin(time * 13 + b.phase) * 3 + Math.sin(time * 7.3 + b.phase * 2) * 2;
    }
  }

  return { colliders, solidMeshes, spawnPoints, update };
}

// ===== audio.js =====
// Процедурный звук через Web Audio API: никаких файлов, всё из шума и осцилляторов.
let ctx = null, out = null, noiseBuf = null;

// Создаём/будим AudioContext. Вызывать только из обработчика нажатия (требование iOS).
function initAudio() {
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    // Компрессор, чтобы громкие звуки не хрипели при наложении
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.ratio.value = 4;
    out = ctx.createGain();
    out.gain.value = 0.55;
    out.connect(comp);
    comp.connect(ctx.destination);
    // Буфер белого шума на 1 секунду — основа для выстрелов и взрывов
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === 'suspended') ctx.resume();
}

// Огибающая громкости: быстрый подъём и плавный спад
function envelope(gain, t, attack, dur, vol) {
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}

// Отфильтрованный шум
function noise({ dur, vol, type = 'lowpass', f0, f1, q = 1, delay = 0 }) {
  if (!ctx || vol < 0.003) return;
  const t = ctx.currentTime + delay;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuf;
  const f = ctx.createBiquadFilter();
  f.type = type;
  f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  envelope(g, t, 0.003, dur, vol);
  src.connect(f).connect(g).connect(out);
  src.start(t, Math.random() * 0.4);
  src.stop(t + dur + 0.05);
}

// Тон с изменением высоты
function tone({ dur, vol, type = 'sine', f0, f1, delay = 0, attack = 0.005 }) {
  if (!ctx || vol < 0.003) return;
  const t = ctx.currentTime + delay;
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ctx.createGain();
  envelope(g, t, attack, dur, vol);
  o.connect(g).connect(out);
  o.start(t);
  o.stop(t + dur + 0.05);
}
