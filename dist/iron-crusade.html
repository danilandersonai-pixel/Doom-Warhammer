<title>Iron Crusade</title>
<meta name="theme-color" content="#a9bcd6">
<style>
/* Интерфейс в духе эталона: минималистичный, нижняя панель по центру, полоса задачи сверху,
   тонкие золотые линии вместо тяжёлых рамок. Пиксельные элементы — без сглаживания. */
:root {
  color-scheme: dark;
  --ink: #0e0a0a;
  --bone: #f2ecdf;
  --gold: #c89a3c;
  --gold-hi: #e8b840;
  --blood: #ca2000;
  --lime: #bbde03;
  --steel: #9ab0d0;
  --panel: rgba(30, 36, 44, 0.86);
  --text: "Yanone Kaffeesatz", "Arial Narrow", "Roboto Condensed", sans-serif;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --btn-scale: 1;
  --btn-alpha: 0.55;
}

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: #a9bcd6; color: var(--bone); font-family: var(--text);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; }
.hidden { display: none !important; }
canvas.pix, #advisor, #portrait, #weaponIcon { image-rendering: pixelated; image-rendering: crisp-edges; }

#hud { position: fixed; inset: 0; pointer-events: none; }

/* прицел — четыре точки */
#crosshair { position: absolute; left: 50%; top: 50%; }
#crosshair i { position: absolute; width: 3px; height: 3px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
#crosshair i:nth-child(1) { left: -1px; top: -9px; } #crosshair i:nth-child(2) { left: -1px; top: 6px; }
#crosshair i:nth-child(3) { left: -9px; top: -1px; } #crosshair i:nth-child(4) { left: 6px; top: -1px; }
#hitmarker {
  --c: #fff; position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; opacity: 0; transform: rotate(45deg);
  background: linear-gradient(var(--c), var(--c)) center top / 3px 7px no-repeat, linear-gradient(var(--c), var(--c)) center bottom / 3px 7px no-repeat,
              linear-gradient(var(--c), var(--c)) left center / 7px 3px no-repeat, linear-gradient(var(--c), var(--c)) right center / 7px 3px no-repeat;
}
#hitmarker.show { animation: hit 0.2s steps(3); }
#hitmarker.kill { --c: #ff3020; }
@keyframes hit { from { opacity: 1; transform: rotate(45deg) scale(1.3); } to { opacity: 0; transform: rotate(45deg) scale(1); } }
#damage { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(210, 0, 0, 0.75) 100%); }

/* ---------- полоса задачи (рваные края — фон рисуется в hud.js) ---------- */
#objective {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: min(50vw, 640px); min-height: clamp(44px, 14vh, 80px); display: flex; align-items: center; gap: 2vh;
  padding: 1.4vh 3vh 1.4vh 1.6vh; box-sizing: border-box;
  background-size: 100% 100%; image-rendering: pixelated;
  transition: opacity 0.4s;
}
#objective.dim { opacity: 0; }
.advisorFrame { flex: none; width: clamp(30px, 10vh, 56px); height: clamp(39px, 13vh, 73px); padding: 3px; margin: -6px 0; background: #1a1612; border: 2px solid #6a5226; box-shadow: inset 0 0 0 1px #2e2414, 0 2px 0 #000; }
#advisor { width: 100%; height: 100%; display: block; }
#objText { font-size: clamp(13px, 4.6vh, 27px); line-height: 1.12; letter-spacing: 0.3px; color: #f4f1e8; text-shadow: 0 2px 0 rgba(0,0,0,0.6); }
#objShort {
  position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  font-size: clamp(14px, 2vw, 19px); color: #f4f1e8; text-shadow: 0 2px 0 #000, 0 0 6px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.4s; white-space: nowrap;
}
#objShort.show { opacity: 1; }

#banner {
  position: absolute; top: 30%; left: 16px; right: 16px; text-align: center;
  font-size: clamp(30px, 8vw, 74px); font-weight: 700; letter-spacing: 4px; color: #ffe6a8;
  text-shadow: 0 3px 0 #6a1408, 0 6px 0 rgba(0,0,0,0.5); opacity: 0;
}
#banner.show { opacity: 1; animation: slam 0.3s steps(5); }
@keyframes slam { from { transform: scale(1.7); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
#pickupMsg { position: absolute; bottom: 21%; left: 50%; transform: translateX(-50%); font-size: clamp(15px, 2.2vw, 21px); color: var(--lime); text-shadow: 0 2px 0 #000; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
#pickupMsg.show { opacity: 1; }

/* ---------- маркер цели и стрелка ---------- */
#marker { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; filter: drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
#marker svg { display: block; margin: 0 auto; animation: pulse 1.2s ease-in-out infinite; }
#markerDist { font-family: var(--pixel); font-size: 8px; color: #fff3cc; text-shadow: 1px 1px 0 #000; }
@keyframes pulse { 50% { transform: scale(1.15); } }
#edgeArrow { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); filter: drop-shadow(0 2px 0 rgba(0,0,0,0.4)); }

/* ---------- полоса босса ---------- */
#bossbar { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 84px); left: 50%; transform: translateX(-50%); width: min(46vw, 520px); text-align: center; }
#bossbar .name { font-size: 18px; letter-spacing: 3px; color: #ffd6a0; text-shadow: 0 2px 0 #000; }
#bossbar .bar { height: 10px; background: rgba(20,10,10,0.7); border: 1px solid var(--gold); }
#bossFill { height: 100%; background: linear-gradient(#ff4020, #9a1408); transform-origin: left; }

/* ---------- нижняя панель ---------- */
#bottom {
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 0; padding-bottom: env(safe-area-inset-bottom);
}
#weaponBox { display: flex; flex-direction: column; align-items: flex-end; margin: 0 10px 10px 0; text-shadow: 1px 1px 0 #000; }
#weaponIcon { width: clamp(48px, 11vh, 84px); height: clamp(20px, 4.6vh, 35px); }
#ammoText { font-family: var(--pixel); font-size: clamp(8px, 2.3vh, 13px); color: #fff3cc; margin-top: 2px; }
#ammoText.low { color: #ff5030; }
#grenText { font-family: var(--pixel); font-size: clamp(6px, 1.7vh, 9px); color: #c8d0dc; margin-top: 4px; }
#portraitBox { width: clamp(52px, 15vh, 150px); height: clamp(52px, 15vh, 150px); position: relative; }
#portrait { width: 100%; height: 100%; display: block; }
#numbers {
  width: clamp(40px, 11vh, 70px); margin: 0 0 1.6vh -2px; padding: 0.9vh 0 1.1vh; text-align: center; font-family: var(--pixel);
  background: rgba(28, 34, 26, 0.88); border: 1px solid #7a6a40; box-shadow: inset 0 0 0 1px #1a1a12;
}
#armorNum { font-size: clamp(7px, 2.2vh, 13px); color: var(--steel); }
#healthNum { font-size: clamp(9px, 2.9vh, 17px); color: #f2f4e8; margin-top: 0.9vh; }
#blade { width: clamp(100px, 33vh, 240px); height: clamp(26px, 8.6vh, 62px); margin: 0 0 1.8vh 2px; }
#dashPip { position: absolute; left: 50%; bottom: 2px; width: 52px; height: 3px; transform: translateX(-50%); background: var(--lime); opacity: 0.8; transform-origin: left; }

#menuBtn {
  position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right));
  width: 40px; height: 34px; padding: 4px; border: 0; background: transparent; pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between;
}
#menuBtn i { display: block; height: 6px; background: var(--lime); box-shadow: 0 0 8px rgba(187, 222, 3, 0.7); }

/* ---------- сенсорные кнопки: маленькие, контурные, полупрозрачные, по краям ---------- */
#touch { position: fixed; inset: 0; }
#stickBase {
  position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%;
  left: 120px; top: calc(100% - 110px); border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06);
  opacity: 0.6; pointer-events: none;
}
#stickBase.active { opacity: 1; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.6); }
.tbtn {
  position: absolute; width: calc(46px * var(--btn-scale)); height: calc(46px * var(--btn-scale)); border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85); color: #fff; background: rgba(20, 24, 32, 0.18);
  opacity: var(--btn-alpha); display: flex; align-items: center; justify-content: center; box-sizing: border-box;
}
.tbtn svg { width: 56%; height: 56%; pointer-events: none; }
.tbtn.big { width: calc(66px * var(--btn-scale)); height: calc(66px * var(--btn-scale)); }
.tbtn.active { background: rgba(232, 184, 64, 0.45); border-color: var(--gold-hi); opacity: 1; }
#btnFire { right: calc(max(16px, env(safe-area-inset-right)) + 0px); bottom: calc(22px * var(--btn-scale)); }
#btnMelee { right: calc(max(16px, env(safe-area-inset-right)) + 80px * var(--btn-scale)); bottom: calc(14px * var(--btn-scale)); }
#btnJump { right: calc(max(16px, env(safe-area-inset-right)) + 10px * var(--btn-scale)); bottom: calc(100px * var(--btn-scale)); }
#btnDash { right: calc(max(16px, env(safe-area-inset-right)) + 66px * var(--btn-scale)); bottom: calc(74px * var(--btn-scale)); }
#btnGrenade { right: calc(max(16px, env(safe-area-inset-right)) + 10px * var(--btn-scale)); bottom: calc(158px * var(--btn-scale)); }
#btnReload { right: calc(max(16px, env(safe-area-inset-right)) + 64px * var(--btn-scale)); bottom: calc(132px * var(--btn-scale)); }

body.touch #crosshair i { width: 3px; height: 3px; }

/* ---------- экраны ---------- */
.overlay {
  position: fixed; inset: 0; display: flex; padding: 16px; box-sizing: border-box;
  background: radial-gradient(ellipse at center, rgba(40, 52, 70, 0.55), rgba(10, 14, 22, 0.9));
  overflow-y: auto;
}
.panel { max-width: 640px; width: 100%; margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 2vh, 12px); }
.panel h1 { margin: 0; font-size: clamp(34px, min(10vw, 15vh), 92px); font-weight: 700; letter-spacing: 6px; line-height: 0.95; color: #f6ead0; text-shadow: 0 4px 0 #7a1810, 0 8px 0 rgba(0,0,0,0.45); text-wrap: balance; }
#screenSub { margin: 0; font-size: clamp(14px, 4.5vh, 20px); letter-spacing: 8px; color: var(--gold-hi); text-transform: uppercase; }
#screenText { font-size: clamp(17px, 2.6vw, 22px); line-height: 1.3; color: #e8eef6; max-width: 560px; }
#screenText .stats { display: grid; grid-template-columns: auto auto; gap: 2px 18px; margin: 4px auto 0; width: max-content; font-size: clamp(17px, 5vh, 24px); text-align: left; }
#screenText .stats b { color: var(--gold-hi); font-weight: 700; text-align: right; }
.buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.panel button {
  font-family: var(--text); font-size: clamp(20px, 6.5vh, 28px); font-weight: 700; letter-spacing: 3px; padding: clamp(5px, 2vh, 10px) 36px; cursor: pointer;
  color: #1e1406; background: linear-gradient(#f0c860, #b88a28); border: 2px solid #f8e0a0; box-shadow: 0 4px 0 #5a3c10, 0 0 0 2px #2a1c08;
}
.panel button.ghost { color: #f2ecdf; background: rgba(20, 24, 32, 0.6); border-color: var(--gold); box-shadow: 0 4px 0 #000; }
.panel button:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a3c10; }
.panel button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#settings { width: min(100%, 440px); text-align: left; background: rgba(20, 24, 32, 0.7); border: 1px solid var(--gold); padding: 6px 14px; font-size: 18px; }
#settings summary { cursor: pointer; color: var(--gold-hi); font-size: 20px; }
#settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; color: #e8eef6; }
#settings label.check { justify-content: flex-start; }
#settings input[type=range] { width: 46%; accent-color: var(--gold-hi); }
#controlsHelp { font-size: 15px; line-height: 1.4; color: #b8c4d6; max-width: 600px; }

/* очень низкий экран (телефон в альбоме): прячем длинные подсказки */
@media (max-height: 430px) { #controlsHelp { display: none; } }

<script type="module">
import * as THREE from 'three';
// ===== physics.js =====
const __m_physics = (() => {

// Простая физика мира: всё твёрдое — это коробки (AABB) с высотой.
// Игрок и враги — вертикальные цилиндры (круг в плоскости XZ + высота).
// Ступеньку ниже STEP можно "перешагнуть", на коробку можно встать сверху.

const STEP = 0.45;   // высота ступеньки, на которую поднимаемся без прыжка

class World {
  constructor() {
    this.boxes = [];   // { minX, maxX, minY, maxY, minZ, maxZ, disabled, enemyOnly, tag }
    this.pits = [];    // прямоугольники пропастей { minX, maxX, minZ, maxZ }
  }

  addBox(minX, maxX, minY, maxY, minZ, maxZ, opts = {}) {
    const b = { minX, maxX, minY, maxY, minZ, maxZ, disabled: false, enemyOnly: false, ...opts };
    this.boxes.push(b);
    return b;
  }

  // Коробка по центру и размерам (y — низ)
  box(x, z, w, d, y0, h, opts) {
    return this.addBox(x - w / 2, x + w / 2, y0, y0 + h, z - d / 2, z + d / 2, opts);
  }

  addPit(minX, maxX, minZ, maxZ) { this.pits.push({ minX, maxX, minZ, maxZ }); }

  inPit(x, z) {
    for (const p of this.pits) if (x > p.minX && x < p.maxX && z > p.minZ && z < p.maxZ) return true;
    return false;
  }

  // Высота опоры под точкой: самая высокая "крыша" коробки не выше y + STEP
  groundAt(x, z, y, r = 0.3, forEnemy = false) {
    let g = this.inPit(x, z) ? -100 : 0;
    for (const b of this.boxes) {
      if (b.disabled || (b.enemyOnly && !forEnemy)) continue;
      if (b.maxY > y + STEP || b.maxY <= g) continue;
      const cx = Math.max(b.minX, Math.min(x, b.maxX)), cz = Math.max(b.minZ, Math.min(z, b.maxZ));
      if ((x - cx) ** 2 + (z - cz) ** 2 < r * r) g = b.maxY;
    }
    return g;
  }

  // Вытолкнуть цилиндр из стен (коробок выше ступеньки на уровне тела)
  resolve(p, r, height, forEnemy = false) {
    for (const b of this.boxes) {
      if (b.disabled || (b.enemyOnly && !forEnemy)) continue;
      // выше пояса — это потолок/перемычка: вбок не толкает (см. ceilingAt)
      if (b.maxY <= p.y + STEP || b.minY >= p.y + height * 0.55) continue;
      const cx = Math.max(b.minX, Math.min(p.x, b.maxX)), cz = Math.max(b.minZ, Math.min(p.z, b.maxZ));
      const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-8) {
        const d = Math.sqrt(d2), k = (r - d) / d;

// Вспышка выстрела: звезда с лучами
function muzzleStar(P, cx, cy, r) {
  for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);
    const a = Math.atan2(dy, dx), ray = Math.pow(Math.abs(Math.cos(a * 3)), 6) * r * 0.5;
    const lim = r * 0.45 + ray;
    if (d > lim) continue;
    const k = d / lim;
    P.set(x, y, k < 0.35 ? [255, 255, 230] : k < 0.65 ? GLOW_YELLOW : GLOW_YELLOW2);
  }
}

// Лужа крови под трупом
function bloodPool(P, cx, cy, rx) {
  P.fill(P.mask().ellipse(cx, cy, rx, rx * 0.22).cut(P.mask().rect(0, 0, P.w, cy - rx * 0.12)), C.blood, { round: 2, grad: 0.1, contour: false });
}

// Кадры смерти: поворачиваем кадр "попадание" вокруг ног и кладём на землю.
// len — примерный рост фигуры в пикселях, thick — половина толщины тела.
function deathFrames(hit, feetX, feetY, dir, len, thick) {
  const out = [];
  const angles = [0.35, 0.85, 1.3, Math.PI / 2];
  angles.forEach((a, i) => {
    const k = a / (Math.PI / 2);
    const dx = -dir * len * 0.45 * k, dy = -thick * k;
    const f = hit.rotated(a * dir, feetX, feetY, dx, dy);
    if (i >= 2) {
      // лежит: подложим лужу крови под тело
      const g = new Pix(hit.w, hit.h);
      bloodPool(g, feetX + dx + dir * len * 0.5, feetY - 2, len * (i === 3 ? 0.42 : 0.28));
      g.draw(f);
      out.push(g.outline());
    } else out.push(f);
  });
  return out;
}

// =====================================================================
// ФАНАТИК: бегун в рваном багровом балахоне, костяная маска, два серпа
// =====================================================================
function drawFanatic(pose) {
  const P = new Pix(96, 96);
  const cx = 48 + (pose.lean || 0), gy = 93;
  const bob = pose.bob || 0;
  const hipY = 60 + bob, shY = 36 + bob, headY = 25 + bob + (pose.headDrop || 0);
  // ноги: lift — подъём ступни, spread — разведение
  const legs = [-1, 1].map((s) => {
    const lift = s < 0 ? pose.liftL || 0 : pose.liftR || 0;
    const hip = [cx + s * 5, hipY];
    const foot = [cx + s * (7 + (pose.spread || 0)), gy - 3 - lift];
    const knee = [cx + s * (8 + lift * 0.4), (hipY + foot[1]) / 2 - lift * 0.3];
    return { hip, knee, foot, lift };
  });
  // плащ сзади (тёмный, рваный)
  P.fill(P.mask().poly([[cx - 14, shY], [cx + 14, shY], [cx + 20, gy - 10], [cx - 20, gy - 10]]).keep((x, y) => y < gy - 14 + ((x * 7) % 5) * 2), C.robeDark, { round: 4, grad: 0.3 });
  // ноги в обмотках
  for (const L of legs) {
    limb(P, L.hip, L.knee, 4, 3.4, C.robeDark, { round: 2 });
    limb(P, L.knee, L.foot, 3.4, 2.8, C.leather, { round: 2, tex: (x, y) => (y % 3 === 0 ? -0.8 : 0) });
    blob(P, L.foot[0], L.foot[1] + 1, 4.5, 2.6, C.iron, { round: 2 });
  }
  // юбка балахона с рваным низом
  P.fill(P.mask().poly([[cx - 11, hipY - 6], [cx + 11, hipY - 6], [cx + 16, hipY + 16], [cx - 16, hipY + 16]])
    .keep((x, y) => y < hipY + 11 + ((x * 13) % 7)), C.robe, { round: 4, tex: folds(0.9, 5, 1) });
  // торс
  P.fill(P.mask().poly([[cx - 12, shY], [cx + 12, shY], [cx + 10, hipY - 2], [cx - 10, hipY - 2]]), C.robe, { round: 5, grad: 0.35 });
  // ремни крест-накрест
  P.fill(P.mask().limb(cx - 10, shY + 2, cx + 9, hipY - 4, 1.6), C.leather, { round: 1 });
  P.fill(P.mask().limb(cx + 10, shY + 2, cx - 9, hipY - 4, 1.6), C.leather, { round: 1 });
  blob(P, cx, shY + 13, 2.5, 2.5, C.brass, { round: 2 });
  // пояс
  P.fill(P.mask().rect(cx - 11, hipY - 6, 22, 3), C.leather, { round: 1 });
  // руки: плечо -> локоть -> кисть (кисти задаёт поза)
  const arms = [-1, 1].map((s) => {
    const sh = [cx + s * 12, shY + 3];
    const hand = s < 0 ? pose.handL : pose.handR;
    const h = [cx + hand[0] * s, shY + hand[1]];
    const el = [(sh[0] + h[0]) / 2 + s * 3, (sh[1] + h[1]) / 2 + 2];
    return { s, sh, el, h };
  });
  // шипастый ворот
  for (let i = -3; i <= 3; i++) P.fill(P.mask().poly([[cx + i * 4 - 2, shY + 1], [cx + i * 4 + 2, shY + 1], [cx + i * 4, shY - 5]]), C.iron, { round: 1 });
  // голова: острый капюшон, ниспадающий на плечи, внутри — костяная маска-череп
  const hood = P.mask().ellipse(cx, headY + 1, 10, 10.5)
    .poly([[cx - 7, headY - 6], [cx + 5, headY - 7], [cx + 3, headY - 17]])
    .poly([[cx - 12, headY + 4], [cx + 12, headY + 4], [cx + 14, shY + 4], [cx - 14, shY + 4]]);
  P.fill(hood, C.robe, { round: 5, grad: 0.45, bias: -0.08, tex: folds(0.6, 7, 3) });
  P.fill(P.mask().ellipse(cx, headY + 2, 6.5, 7.5), C.robeDark, { round: 2, bias: -0.6, contour: false });
  P.fill(P.mask().ellipse(cx, headY + 2.5, 4.6, 5.8).cut(P.mask().rect(cx - 6, headY + 6, 12, 1)), C.bone, { round: 2.5 });
  // глазницы и горящие зрачки
  for (const s2 of [-1, 1]) {
    P.rect(cx + (s2 < 0 ? -4 : 1), headY, 3, 3, [24, 8, 10]);
    P.set(cx + (s2 < 0 ? -3 : 2), headY + 1, GLOW_ORANGE);
  }
  P.set(cx, headY + 3, [40, 20, 20]);                       // нос
  for (let i = -2; i <= 2; i++) P.set(cx + i, headY + 6, i % 2 ? [200, 190, 170] : [40, 20, 20]); // зубы
  // руки и серпы
  for (const A of arms) {
    limb(P, A.sh, A.el, 3.6, 3, C.flesh, { round: 2 });
    limb(P, A.el, A.h, 3, 2.6, C.flesh, { round: 2, tex: (x, y) => ((x + y) % 4 === 0 ? -0.7 : 0) });
    blob(P, A.h[0], A.h[1], 3, 3, C.leather, { round: 2 });
    // серп: рукоять + изогнутое лезвие (направление задаёт поза)
    const ang = (A.s < 0 ? pose.bladeL : pose.bladeR) ?? 1.9;
    const tip = [A.h[0] + Math.cos(ang) * 16 * A.s, A.h[1] + Math.sin(ang) * 16];
    limb(P, A.h, [A.h[0] + Math.cos(ang) * 5 * A.s, A.h[1] + Math.sin(ang) * 5], 1.2, 1.2, C.leather, { round: 1 });
    const blade = P.mask();
    for (let t = 0.3; t <= 1; t += 0.05) {
      const bx = A.h[0] + (tip[0] - A.h[0]) * t + Math.sin(t * Math.PI) * 5 * A.s * Math.sin(ang);
      const by = A.h[1] + (tip[1] - A.h[1]) * t - Math.sin(t * Math.PI) * 5 * Math.cos(ang);
      blade.ellipse(bx, by, 2.2 * (1.1 - t * 0.7), 2.2 * (1.1 - t * 0.7));
    }
    P.fill(blade, C.steel, { round: 1.5, grad: 0, bias: 0.15 });
  }
  return P;
}

// СТРЕЛОК: шинель цвета ржавчины, противогаз с зелёными линзами, автомат у бедра
// =====================================================================
function drawGunner(pose) {
  const P = new Pix(96, 96);
  const cx = 48 + (pose.lean || 0), gy = 93, bob = pose.bob || 0;
  const hipY = 58 + bob, shY = 34 + bob, headY = 23 + bob + (pose.headDrop || 0);
  // рюкзак/скатка за спиной
  blob(P, cx, shY + 4, 15, 7, C.olive, { round: 3 });
  // ноги в сапогах
  for (const s of [-1, 1]) {
    const lift = s < 0 ? pose.liftL || 0 : pose.liftR || 0;
    const hip = [cx + s * 6, hipY], foot = [cx + s * (8 + (pose.spread || 0)), gy - 3 - lift];
    const knee = [cx + s * (8 + lift * 0.3), (hipY + foot[1]) / 2 - lift * 0.3];
    limb(P, hip, knee, 4.5, 4, C.iron, { round: 2 });
    limb(P, knee, foot, 4, 3.6, C.leather, { round: 2, bias: -0.15 });
    blob(P, foot[0], foot[1] + 1, 5, 2.8, C.iron, { round: 2, bias: -0.2 });
    blob(P, knee[0], knee[1], 3.4, 3, C.iron, { round: 2, bias: 0.15 }); // наколенник
  }
  // полы шинели
  P.fill(P.mask().poly([[cx - 13, hipY - 8], [cx + 13, hipY - 8], [cx + 17, hipY + 18], [cx + 3, hipY + 17], [cx, hipY + 4], [cx - 3, hipY + 17], [cx - 17, hipY + 18]]),
    C.coat, { round: 4, tex: folds(0.8, 6, 2) });
  // торс шинели
  P.fill(P.mask().poly([[cx - 14, shY], [cx + 14, shY], [cx + 13, hipY - 4], [cx - 13, hipY - 4]]), C.coat, { round: 5, grad: 0.3 });
  // бронежилет
  P.fill(P.mask().poly([[cx - 9, shY + 2], [cx + 9, shY + 2], [cx + 8, hipY - 8], [cx - 8, hipY - 8]]), C.iron, { round: 3, tex: (x, y) => (y % 6 === 0 ? -0.7 : 0) });
  // подсумки и ремень
  P.fill(P.mask().rect(cx - 13, hipY - 8, 26, 3), C.leather, { round: 1 });
  for (const s of [-1, 1]) P.fill(P.mask().rect(cx + s * 8 - 2, hipY - 12, 5, 5), C.olive, { round: 1 });
  // наплечники
  for (const s of [-1, 1]) blob(P, cx + s * 13, shY + 2, 6, 4.5, C.iron, { round: 3 });
  // голова: каска + противогаз
  blob(P, cx, headY + 4, 7, 7, C.robeDark, { round: 3 });                         // капюшон-подшлемник
  blob(P, cx, headY + 4, 6, 6.5, C.iron, { round: 3, bias: -0.1 });              // маска
  blob(P, cx - 3, headY + 3, 2.4, 2.4, [[40, 60, 20], [60, 110, 30], GLOW_GREEN2, GLOW_GREEN, [240, 255, 200]], { round: 2, contour: false });
  blob(P, cx + 3, headY + 3, 2.4, 2.4, [[40, 60, 20], [60, 110, 30], GLOW_GREEN2, GLOW_GREEN, [240, 255, 200]], { round: 2, contour: false });
  blob(P, cx, headY + 9, 3, 2.6, C.steel, { round: 2 });                          // фильтр
  limb(P, [cx + 2, headY + 10], [cx + 10, shY + 6], 1.2, 1.2, C.leather, { round: 1 }); // шланг
  P.fill(P.mask().ellipse(cx, headY - 1, 8.5, 5.5).cut(P.mask().rect(0, headY + 1, 96, 30)), C.olive, { round: 3 }); // каска
  P.fill(P.mask().rect(cx - 9, headY, 18, 2), C.olive, { round: 1, bias: -0.2 });
  // руки и автомат (держит у бедра, ствол на зрителя чуть вправо)
  const gunX = cx + (pose.gunX || 4), gunY = shY + (pose.gunY || 17);
  limb(P, [cx - 13, shY + 3], [cx - 9, shY + 13], 3.8, 3.4, C.coat, { round: 2 });
  limb(P, [cx - 9, shY + 13], [gunX - 4, gunY + 2], 3.4, 3, C.coat, { round: 2 });
  limb(P, [cx + 13, shY + 3], [cx + 14, shY + 13], 3.8, 3.4, C.coat, { round: 2 });
  limb(P, [cx + 14, shY + 13], [gunX + 7, gunY + 4], 3.4, 3, C.coat, { round: 2 });
  // автомат: приклад, корпус, магазин, ствол с дульным тормозом
  P.fill(P.mask().poly([[gunX - 12, gunY - 2], [gunX + 10, gunY - 3], [gunX + 12, gunY + 4], [gunX - 12, gunY + 5]]), C.iron, { round: 2 });
  P.fill(P.mask().rect(gunX - 2, gunY + 4, 4, 8), C.iron, { round: 1, bias: -0.2 });
  P.fill(P.mask().poly([[gunX + 8, gunY - 4], [gunX + 16, gunY - 2], [gunX + 16, gunY + 3], [gunX + 8, gunY + 3]]), C.steel, { round: 1.5 });
  blob(P, gunX + 16, gunY, 2.4, 3, C.iron, { round: 1, bias: -0.3 });
  P.set(gunX + 16, gunY, [10, 10, 10]);
  P.fill(P.mask().rect(gunX - 8, gunY - 4, 10, 2), C.brass, { round: 1 });
  blob(P, gunX - 4, gunY + 3, 3, 3, C.leather, { round: 2 });
  blob(P, gunX + 7, gunY + 5, 3, 3, C.leather, { round: 2 });
  if (pose.flash) muzzleStar(P, gunX + 18, gunY, 11);
  return P;
}

// ТЯЖЁЛЫЙ ДЕМОН: сутулый громила с рогами и когтями
// =====================================================================
function drawHeavy(pose) {
  const P = new Pix(128, 128);
  const cx = 64 + (pose.lean || 0), gy = 125, bob = pose.bob || 0;
  const hipY = 84 + bob, shY = 44 + bob, headY = 47 + bob + (pose.headDrop || 0);
  // жилы-полосы на коже
  const sinew = (x, y) => (((x * 2 + y) % 9) === 0 ? -0.9 : 0);
  // шипы на спине (видны над плечами)
  for (let k = -2; k <= 2; k++) P.fill(P.mask().poly([[cx + k * 9 - 4, shY + 4], [cx + k * 9 + 4, shY + 4], [cx + k * 11, shY - 14 + Math.abs(k) * 4]]), C.horn, { round: 1.5 });
  // ноги — толстые, "звериные"
  for (const s of [-1, 1]) {
    const lift = s < 0 ? pose.liftL || 0 : pose.liftR || 0;
    const hip = [cx + s * 12, hipY], knee = [cx + s * (19 + lift * 0.3), hipY + 15 - lift * 0.4], foot = [cx + s * (15 + (pose.spread || 0)), gy - 4 - lift];
    limb(P, hip, knee, 10, 8, C.demon, { round: 4, tex: sinew });
    limb(P, knee, foot, 7, 5, C.demonDark, { round: 3 });
    blob(P, foot[0], foot[1] + 1, 9, 4, C.demonDark, { round: 2 });
    for (let k = -1; k <= 1; k++) P.fill(P.mask().poly([[foot[0] + k * 5 - 1.5, foot[1] + 3], [foot[0] + k * 5 + 1.5, foot[1] + 3], [foot[0] + k * 6, foot[1] + 7]]), C.horn, { round: 1 });
  }
  // набедренные железные пластины на цепях
  P.fill(P.mask().poly([[cx - 17, hipY - 6], [cx + 17, hipY - 6], [cx + 11, hipY + 15], [cx - 11, hipY + 15]]), C.iron, { round: 2, tex: (x, y) => (x % 7 === 0 ? -0.9 : y % 6 === 0 ? 0.6 : 0) });
  // торс: широкая грудь, живот с рубцами
  P.fill(P.mask().poly([[cx - 30, shY + 2], [cx + 30, shY + 2], [cx + 22, hipY - 2], [cx - 22, hipY - 2]]), C.demon, { round: 6, grad: 0.35, tex: sinew });
  P.fill(P.mask().poly([[cx - 13, shY + 26], [cx + 13, shY + 26], [cx + 11, hipY - 4], [cx - 11, hipY - 4]]), C.demonBelly, { round: 4, tex: (x, y) => (y % 5 === 0 ? -1 : 0) });
  for (const s of [-1, 1]) P.fill(P.mask().poly([[cx + s * 2, shY + 6], [cx + s * 26, shY + 4], [cx + s * 22, shY + 22], [cx + s * 3, shY + 24]]), C.demon, { round: 5, bias: 0.1 });
  // латунное кольцо в груди и шрамы
  blob(P, cx, shY + 20, 4, 4, C.brass, { round: 2 });
  P.line(cx - 18, shY + 10, cx - 8, shY + 18, hex('#2a1018'));
  P.line(cx + 8, shY + 28, cx + 16, shY + 22, hex('#2a1018'));
  // массивные плечи-наплечники из кости
  for (const s of [-1, 1]) {
    blob(P, cx + s * 27, shY + 4, 13, 10, C.demon, { round: 5, tex: sinew });
    P.fill(P.mask().poly([[cx + s * 18, shY - 4], [cx + s * 38, shY - 2], [cx + s * 34, shY + 6], [cx + s * 20, shY + 4]]), C.horn, { round: 2 });
  }
  // голова втянута между плеч, рога вперёд
  blob(P, cx, headY, 10, 9, C.demonDark, { round: 4 });
  for (const s of [-1, 1]) {
    const horn = P.mask();
    for (let t = 0; t <= 1; t += 0.04) horn.ellipse(cx + s * (8 + t * 18), headY - 5 - Math.sin(t * 2.2) * 14 + t * t * 6, 4.5 * (1 - t * 0.8), 4.5 * (1 - t * 0.8));
    P.fill(horn, C.horn, { round: 2, tex: (x, y) => ((x + y) % 4 === 0 ? -0.7 : 0) });
  }
  P.rect(cx - 7, headY - 3, 5, 3, [16, 4, 6]); P.rect(cx + 2, headY - 3, 5, 3, [16, 4, 6]);
  P.rect(cx - 6, headY - 2, 3, 1, GLOW_YELLOW); P.rect(cx + 3, headY - 2, 3, 1, GLOW_YELLOW);
  P.set(cx - 5, headY - 1, GLOW_YELLOW2); P.set(cx + 4, headY - 1, GLOW_YELLOW2);
  // пасть с клыками
  P.fill(P.mask().ellipse(cx, headY + 5, 7, 3), [[30, 6, 10], [60, 10, 16], [90, 20, 24], [110, 30, 30], [130, 40, 40]], { round: 1, contour: false });
  for (let k = -2; k <= 2; k++) P.fill(P.mask().poly([[cx + k * 3 - 1, headY + 3], [cx + k * 3 + 1, headY + 3], [cx + k * 3, headY + 6 + (k % 2 ? 0 : 2)]]), C.horn, { round: 1, contour: false });
  // руки с когтями
  for (const s of [-1, 1]) {
    const hand = s < 0 ? pose.handL : pose.handR;
    const sh = [cx + s * 30, shY + 8], h = [cx + s * hand[0], shY + hand[1]];
    const el = [(sh[0] + h[0]) / 2 + s * 6, (sh[1] + h[1]) / 2];
    limb(P, sh, el, 9, 7, C.demon, { round: 4, tex: sinew });
    limb(P, el, h, 7, 6, C.demon, { round: 3, tex: sinew });
    blob(P, el[0], el[1], 5, 4, C.iron, { round: 2 }); // наруч
    blob(P, h[0], h[1], 7, 6, C.demonDark, { round: 3 });
    const cd = (s < 0 ? pose.clawL : pose.clawR) ?? 1.4; // направление когтей
    for (let k = -1; k <= 1; k++) {
      const a = cd + k * 0.35;
      const base = [h[0] + Math.cos(a) * 5 * s, h[1] + Math.sin(a) * 5];
      const tip = [h[0] + Math.cos(a) * 16 * s, h[1] + Math.sin(a) * 16];
      limb(P, base, tip, 2.2, 0.6, C.horn, { round: 1 });
    }
  }
  return P;
}

    this.next = (this.next + 1) % this.items.length;
    h.s.position.set(p.x, p.y, p.z);
    h.s.material.color.set(color);
    h.t = h.dur = dur;
    h.size = size;
    h.s.visible = true;
  }

  update(dt) {
    for (const h of this.items) {
      if (h.t <= 0) continue;
      h.t -= dt;
      if (h.t <= 0) { h.s.visible = false; continue; }
      const k = h.t / h.dur;
      h.s.scale.set(h.size * (0.6 + k * 0.4), h.size * (0.6 + k * 0.4), 1);

// ---------- Куски (гибы): летят, отскакивают, лежат до конца уровня (до лимита) ----------
class Gibs {
  constructor(scene, count = 120) {
    const art = miscArt();
    const textures = art.gibs.map((c) => nearestTexture(c));
    this.items = [];
    for (let i = 0; i < count; i++) {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textures[i % textures.length] }));
      s.visible = false;
      scene.add(s);
      this.items.push({ s, vel: new THREE.Vector3(), active: false, rest: false, size: 0.3, spin: 0, floor: 0 });
    }
    this.next = 0;
  }

  burst(p, count, power = 6, size = 0.3, floorY = 0) {
    for (let n = 0; n < count; n++) {
      const g = this.items[this.next];
      this.next = (this.next + 1) % this.items.length;
      g.s.position.set(p.x + (Math.random() - 0.5) * 0.4, p.y + Math.random() * 0.5, p.z + (Math.random() - 0.5) * 0.4);
      const a = Math.random() * Math.PI * 2, h = power * (0.3 + Math.random() * 0.7);
      g.vel.set(Math.cos(a) * h, power * (0.5 + Math.random() * 0.8), Math.sin(a) * h);
      g.size = size * (0.6 + Math.random() * 0.9);
      g.s.scale.set(g.size, g.size, 1);
      g.spin = (Math.random() - 0.5) * 16;
      g.active = true;
      g.rest = false;
      g.floor = floorY;
      g.s.visible = true;
    }
  }

  update(dt, world) {
    for (const g of this.items) {
      if (!g.active || g.rest) continue;
      g.vel.y -= 20 * dt;
      g.s.position.addScaledVector(g.vel, dt);
      g.s.material.rotation += g.spin * dt;
      const p = g.s.position;
      const floor = world ? world.groundAt(p.x, p.z, p.y + 0.3, 0.05) : g.floor;
      if (p.y < floor + g.size * 0.3) {
        p.y = floor + g.size * 0.3;
        if (Math.abs(g.vel.y) < 2.5) g.rest = true;
        g.vel.y *= -0.3; g.vel.x *= 0.45; g.vel.z *= 0.45; g.spin *= 0.4;
      }
      if (p.y < -30) { g.active = false; g.s.visible = false; }
    }
  }

  clear() { for (const g of this.items) { g.active = false; g.s.visible = false; } }
}

// ---------- Декали: кровь на полу и стенах, копоть от взрывов ----------
class Decals {
  constructor(scene, count = 70) {
    const art = miscArt();
    const mk = (c) => new THREE.MeshLambertMaterial({ map: nearestTexture(c), transparent: true, alphaTest: 0.35, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
    this.blood = art.splats.map(mk);
    this.scorch = mk(art.scorch);
    this.geo = new THREE.PlaneGeometry(1, 1);
    this.items = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(this.geo, this.blood[0]);
      m.visible = false;
      scene.add(m);
      this.items.push(m);
    }
    this.next = 0;
    this.tmp = new THREE.Vector3();
  }

  // Декаль на поверхности: point — точка, normal — нормаль поверхности
  add(point, normal, size, kind = 'blood') {
    const m = this.items[this.next];
    this.next = (this.next + 1) % this.items.length;
    m.material = kind === 'scorch' ? this.scorch : this.blood[(Math.random() * this.blood.length) | 0];
    m.position.copy(point).addScaledVector(normal, 0.015 + (this.next % 7) * 0.002);
    m.lookAt(this.tmp.copy(m.position).add(normal));
    m.rotateZ(Math.random() * Math.PI * 2);
    m.scale.set(size, size, 1);
    m.visible = true;
  }

  floor(x, y, z, size, kind) { this.add(this.tmp.set(x, y, z).clone(), new THREE.Vector3(0, 1, 0), size, kind); }

  clear() { for (const m of this.items) m.visible = false; }
}

// ---------- Пиксельные взрывы: кадры спрайта + свет + ореол + угольки ----------
class Explosions {
  constructor(scene, fx, count = 14) {
    const art = miscArt().explosion;
    this.frames = art.count;
    this.fx = fx;
    this.items = [];
    for (let i = 0; i < count; i++) {
      const map = nearestTexture(art.canvas);
      map.repeat.set(1 / art.count, 1);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map, depthWrite: false, transparent: true }));
      s.visible = false;
      scene.add(s);
      this.items.push({ s, map, t: -1, dur: 0.6 });
    }
    this.next = 0;
  }

  spawn(p, size = 3, dur = 0.65) {
    const e = this.items[this.next];
    this.next = (this.next + 1) % this.items.length;
    e.s.position.set(p.x, p.y + size * 0.15, p.z);
    e.s.scale.set(size, size, 1);
    e.s.material.rotation = Math.floor(Math.random() * 4) * Math.PI / 2;
    e.t = 0;
    e.dur = dur;
    e.s.visible = true;
    e.map.offset.x = 0;
    this.fx.lights.flash(p, 0xff9030, 40 * size, 0.35, 6 + size * 3);
    this.fx.halos.spawn({ x: p.x, y: p.y + 0.3, z: p.z }, 0xffa040, size * 2.2, 0.3);

  }

  update(dt) {
    for (const e of this.items) {
      if (e.t < 0) continue;
      e.t += dt;
      const f = Math.floor((e.t / e.dur) * this.frames);
      if (f >= this.frames) { e.t = -1; e.s.visible = false; continue; }
      e.map.offset.x = f / this.frames;
    }
  }

  clear() { for (const e of this.items) { e.t = -1; e.s.visible = false; } }
}

// ---------- Снегопад: пиксельные хлопья вокруг камеры ----------
class Snowfall {
  constructor(scene, count = 900) {
    this.count = count;
    this.pos = new Float32Array(count * 3);
    this.drift = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.pos[i * 3] = (Math.random() - 0.5) * 50;
      this.pos[i * 3 + 1] = Math.random() * 20;
      this.pos[i * 3 + 2] = (Math.random() - 0.5) * 50;
      this.drift[i] = Math.random() * 6.28;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.5, sizeAttenuation: false, transparent: true, opacity: 0.85, depthWrite: false }));
    this.points.frustumCulled = false;
    scene.add(this.points);
  }

  update(dt, cam, time) {
    for (let i = 0; i < this.count; i++) {
      const k = i * 3;
      this.pos[k + 1] -= dt * (1.2 + (i % 5) * 0.25);
      this.pos[k] += Math.sin(time * 0.7 + this.drift[i]) * dt * 0.6 + dt * 0.5;
      // держим хлопья в кубе 50×20×50 вокруг камеры
      if (this.pos[k + 1] < cam.y - 4) this.pos[k + 1] += 20;
      if (this.pos[k] - cam.x > 25) this.pos[k] -= 50; else if (this.pos[k] - cam.x < -25) this.pos[k] += 50;
      if (this.pos[k + 2] - cam.z > 25) this.pos[k + 2] -= 50; else if (this.pos[k + 2] - cam.z < -25) this.pos[k + 2] += 50;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
  }
}

// ---------- Трассеры и луч термокопья ----------
class Beams {
  constructor(scene, count = 10) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    geo.translate(0, 0, 0.5);
    this.items = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffd080, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
      m.visible = false;
      scene.add(m);
      this.items.push({ m, t: 0, dur: 0.06, w: 0.04 });
    }
    this.next = 0;
    // луч термокопья: ядро + оболочка, видимы только пока стреляем
    this.beamCore = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    this.beamGlow = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xff6018, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    this.beamCore.visible = this.beamGlow.visible = false;
    scene.add(this.beamCore, this.beamGlow);
  }

  tracer(from, to, color = 0xffd080, w = 0.04, dur = 0.06) {
    const t = this.items[this.next];
    this.next = (this.next + 1) % this.items.length;
    t.m.position.copy(from);
    t.m.lookAt(to);
    t.m.scale.set(w, w, from.distanceTo(to));
    t.m.material.color.set(color);
    t.t = t.dur = dur;
    t.m.visible = true;
  }

  beam(from, to, on, time) {
    this.beamCore.visible = this.beamGlow.visible = on;
    if (!on) return;
    const len = from.distanceTo(to), wob = 1 + Math.sin(time * 60) * 0.15;
    for (const [m, w] of [[this.beamCore, 0.07 * wob], [this.beamGlow, 0.22 * wob]]) {
      m.position.copy(from);
      m.lookAt(to);
      m.scale.set(w, w, len);
    }
  }

  update(dt) {
    for (const t of this.items) {
      if (t.t <= 0) continue;
      t.t -= dt;
      t.m.material.opacity = Math.max(0, t.t / t.dur);
      if (t.t <= 0) t.m.visible = false;
    }
  }

  clear() { for (const t of this.items) { t.t = 0; t.m.visible = false; } this.beamCore.visible = this.beamGlow.visible = false; }
}

// Собрать все эффекты в один объект
function createFX(scene) {
  const fx = {};
  fx.blood = new Particles(scene, 900);
  fx.dust = new Particles(scene, 300);
  fx.sparks = new Particles(scene, 500, { additive: true });
  fx.lights = new LightPool(scene, 4);
  fx.halos = new Halos(scene, 28);
  fx.gibs = new Gibs(scene, 120);
  fx.decals = new Decals(scene, 80);
  fx.explosions = new Explosions(scene, fx, 14);
  fx.snow = new Snowfall(scene);
  fx.beams = new Beams(scene);
  fx.update = (dt, world, cam, time) => {
    fx.blood.update(dt); fx.dust.update(dt); fx.sparks.update(dt);
    fx.lights.update(dt); fx.halos.update(dt); fx.gibs.update(dt, world);
    fx.explosions.update(dt); fx.snow.update(dt, cam, time); fx.beams.update(dt);
  };
  fx.setScale = (h) => { fx.blood.setScale(h); fx.dust.setScale(h); fx.sparks.setScale(h); };
  fx.clear = () => {
    fx.blood.clear(); fx.dust.clear(); fx.sparks.clear(); fx.lights.clear(); fx.halos.clear();
    fx.gibs.clear(); fx.decals.clear(); fx.explosions.clear(); fx.beams.clear();
  };
  // Фонтан крови: крупные и мелкие капли разного размера + кусок-другой
  fx.bloodBurst = (p, amount = 1, dir = null) => {
    fx.blood.burst(p, Math.round(26 * amount), 0xd0141c, { speed: 6, life: 0.9, gravity: 14, size: 0.09, sizeVar: 1.4, dir, spread: 0.9 });
    fx.blood.burst(p, Math.round(8 * amount), 0xff4a50, { speed: 3, life: 0.6, gravity: 10, size: 0.2, sizeVar: 1, alpha: 0.75, dir });
  };
  return fx;
}

return { Particles, LightPool, Halos, Gibs, Decals, Explosions, Snowfall, Beams, createFX };

const __m_player = (() => {

// Игрок: быстрый бег с лёгкой инерцией, прыжок, рывок (дэш) с откатом, гравитация,
// ступеньки, пропасть с возвратом на чекпоинт, здоровье и броня, тряска камеры.

const SPEED = 8.5;
const ACCEL_GROUND = 60, ACCEL_AIR = 16;
const JUMP_V = 7.0, GRAVITY = 21;
const DASH_SPEED = 21, DASH_TIME = 0.17;
const DASH_COOLDOWN = 1.1;
const EYE = 1.62, HEIGHT = 1.8;
const HEALTH_MAX = 200, ARMOR_MAX = 200;   // подборы поднимают выше 100, как в классике

class Player {
  constructor(world) {
    this.world = world;
    this.radius = 0.4;
    this.reset({ x: 0, z: 30, yaw: 0 });
  }

  reset(start) {
    this.pos = { x: start.x, y: start.y || 0, z: start.z };
    this.vel = { x: 0, y: 0, z: 0 };
    this.yaw = start.yaw || 0;
    this.pitch = 0;
    this.health = 100;
    this.armor = 50;
    this.onGround = true;
    this.dashT = 0;        // >0 — идёт рывок
    this.dashCd = 0;       // откат рывка
    this.dashDir = { x: 0, z: 0 };
    this.trauma = 0;
    this.hurtFlash = 0;
    this.kick = 0;
    this.bob = 0;
    this.speed01 = 0;
    this.land = 0;         // "присед" камеры после приземления
    this.dead = false;
    this.checkpoint = { x: start.x, y: 0, z: start.z };
    this.cpTimer = 0;
    this.stepT = 0;
    this.events = [];      // 'jump' | 'land' | 'dash' | 'step' | 'fall' — для звука
  }

  forward() { return { x: -Math.sin(this.yaw), z: -Math.cos(this.yaw) }; }

  look(dx, dy) {
    this.yaw -= dx;
    this.pitch = Math.max(-1.45, Math.min(1.45, this.pitch - dy));
  }

  jump() {
    if (!this.onGround || this.dead) return;
    this.vel.y = JUMP_V;
    this.onGround = false;
    this.events.push('jump');
  }

  dash(move) {
    if (this.dashCd > 0 || this.dead) return;
    const f = this.forward();
    let dx = -f.z * move.x + f.x * move.z, dz = f.x * move.x + f.z * move.z;
    // при неподвижности рывок вперёд
    if (Math.hypot(dx, dz) < 0.2) { dx = f.x; dz = f.z; }
    const l = Math.hypot(dx, dz);
    this.dashDir = { x: dx / l, z: dz / l };
    this.dashT = DASH_TIME;
    this.dashCd = DASH_COOLDOWN;
    this.addTrauma(0.15);
    this.events.push('dash');
  }

  update(dt, move) {
    const f = this.forward();
    const rx = -f.z, rz = f.x; // вправо
    const tx = (rx * move.x + f.x * move.z) * SPEED;
    const tz = (rz * move.x + f.z * move.z) * SPEED;
    this.dashCd = Math.max(0, this.dashCd - dt);
    if (this.dashT > 0) {
      this.dashT -= dt;
      this.vel.x = this.dashDir.x * DASH_SPEED;
      this.vel.z = this.dashDir.z * DASH_SPEED;
      if (this.vel.y < 0) this.vel.y *= 0.6; // рывок слегка "подвешивает" в воздухе
    } else {
      // лёгкая инерция: разгон к целевой скорости
      const a = (this.onGround ? ACCEL_GROUND : ACCEL_AIR) * dt;
      const dvx = tx - this.vel.x, dvz = tz - this.vel.z, dl = Math.hypot(dvx, dvz);
      if (dl > 0) { const k = Math.min(1, a / dl); this.vel.x += dvx * k; this.vel.z += dvz * k; }
    }
    this.vel.y -= GRAVITY * dt;

    const prevY = this.pos.y;
    // движение мелкими шагами (≤ 0.25 м), чтобы рывок не "проскакивал" сквозь тонкие стены
    const dx = this.vel.x * dt, dz = this.vel.z * dt;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dz) / 0.25));
    for (let i = 0; i < steps; i++) {
      this.pos.x += dx / steps;
      this.pos.z += dz / steps;
      this.world.resolve(this.pos, this.radius, HEIGHT);
    }
    this.pos.y += this.vel.y * dt;

    // земля под ногами
    const g = this.world.groundAt(this.pos.x, this.pos.z, Math.max(this.pos.y, prevY), this.radius * 0.7);
    const wasGround = this.onGround;
    if (this.pos.y <= g + 0.001 && g > -50) {
      if (!wasGround && this.vel.y < -6) { this.land = Math.min(0.25, -this.vel.y * 0.02); this.events.push('land'); }
      this.pos.y = g;
      this.vel.y = 0;
      this.onGround = true;
    } else if (this.pos.y - g > 0.05) {
      // со ступеньки вниз "прилипаем", если невысоко и не в прыжке
      if (wasGround && this.vel.y <= 0 && this.pos.y - g < 0.5) { this.pos.y = g; this.vel.y = 0; this.onGround = true; }
      else this.onGround = false;
    }
    // потолок: удар головой останавливает прыжок
    const ceil = this.world.ceilingAt(this.pos.x, this.pos.z, this.pos.y, this.radius * 0.8, HEIGHT);
    if (this.pos.y + HEIGHT > ceil) { this.pos.y = Math.max(g, ceil - HEIGHT); if (this.vel.y > 0) this.vel.y = 0; }

    // чекпоинт: последняя надёжная точка на земле
    this.cpTimer -= dt;
    if (this.onGround && this.cpTimer <= 0 && !this.world.inPit(this.pos.x + this.vel.x * 0.4, this.pos.z + this.vel.z * 0.4)) {
      this.checkpoint = { x: this.pos.x, y: this.pos.y, z: this.pos.z };
      this.cpTimer = 0.5;
    }
    // упал в пропасть
    if (this.pos.y < -7) {
      this.events.push('fall');
      this.pos = { ...this.checkpoint };
      this.vel = { x: 0, y: 0, z: 0 };
      this.damage(15, true);
    }

    const hs = Math.hypot(this.vel.x, this.vel.z);
    this.speed01 = Math.min(1, hs / SPEED);
    if (this.onGround) {
      this.bob += dt * 12 * this.speed01;
      this.stepT -= dt * this.speed01;
      if (this.stepT <= 0 && this.speed01 > 0.3) { this.stepT = 0.36; this.events.push('step'); }
    }
    this.trauma = Math.max(0, this.trauma - dt * 1.8);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.2);
    this.kick *= Math.exp(-12 * dt);
    this.land *= Math.exp(-9 * dt);
  }

  // Урон: броня поглощает 2/3, остальное — здоровье
  damage(amount, ignoreArmor = false) {
    if (this.dead) return;
    let toArmor = ignoreArmor ? 0 : Math.min(this.armor, amount * 0.66);
    this.armor -= toArmor;
    this.health -= amount - toArmor;
    this.hurtFlash = Math.min(1, this.hurtFlash + 0.5 + amount * 0.02);
    this.addTrauma(0.25 + amount * 0.01);
    if (this.health <= 0) { this.health = 0; this.dead = true; }
  }

  addTrauma(t) { this.trauma = Math.min(1, this.trauma + t); }

  applyCamera(camera, time) {
    const s = this.trauma * this.trauma;
    const n1 = Math.sin(time * 41.3) * Math.sin(time * 17.1 + 1.7);
    const n2 = Math.sin(time * 37.7 + 3.1) * Math.sin(time * 23.3);
    const n3 = Math.sin(time * 29.9 + 5.3);
    const bobY = Math.sin(this.bob * 2) * 0.05 * this.speed01 * (this.onGround ? 1 : 0);
    camera.position.set(this.pos.x, this.pos.y + EYE + bobY - this.land, this.pos.z);
    camera.rotation.set(this.pitch + this.kick + n1 * 0.07 * s, this.yaw + n2 * 0.07 * s, n3 * 0.05 * s + Math.sin(this.bob) * 0.006 * this.speed01, 'YXZ');
    const fovTarget = this.dashT > 0 ? 1.12 : 1;
    camera.userData.fovK = (camera.userData.fovK || 1) + (fovTarget - (camera.userData.fovK || 1)) * 0.25;
  }
}

return { DASH_COOLDOWN, HEALTH_MAX, ARMOR_MAX, Player };
})();
// ===== art_weapons.js =====
const __m_art_weapons = (() => {
const { Pix, ramp, hex, sheet } = __m_pixel;
// Оружие от первого лица — нарисованные пиксельные спрайты (никаких 3D-боксов).
// Холст кадра 192×144, ствол смотрит вверх в центр экрана, руки в латных перчатках.
// Цвета героя (свои): багровый корпус, сталь, латунь.

const M = {
  casing: ramp('#a01e24', { spread: 0.45 }),
  steel: ramp('#8c94a4', { spread: 0.5 }),
  iron: ramp('#41434e', { spread: 0.4 }),
  brass: ramp('#cba146', { spread: 0.5 }),
  glove: ramp('#6f7a8c', { spread: 0.48 }),
  leather: ramp('#5e3c2a', { spread: 0.4 }),
  cyan: [hex('#0e2a3a'), hex('#14607e'), hex('#2cb4e6'), hex('#8af2ff'), hex('#eaffff')],
  heat: [hex('#3a0e06'), hex('#8e2208'), hex('#e05812'), hex('#ffac36'), hex('#fff2c6')],
};
const W = 192, H = 144;

const fill = (P, m, r, o) => P.fill(m, r, o);
const blob = (P, cx, cy, rx, ry, r, o, rot = 0) => P.fill(P.mask().ellipse(cx, cy, rx, ry, rot), r, o);
const poly = (P, pts, r, o) => P.fill(P.mask().poly(pts), r, o);
const limb = (P, a, b, r1, r2, r, o) => P.fill(P.mask().limb(a[0], a[1], b[0], b[1], r1, r2), r, o);

// Точка между a и b
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
// Точка схода — куда "уходит" оружие (центр экрана, выше кадра)
const VP = [100, -60];
const toward = (pts, t) => pts.map((p) => lerp(p, VP, t));

// Призма в перспективе: near — ближнее сечение [лв, пв, пн, лн], far = near, сдвинутое к точке схода.
// Грани рисуем от дальних к ближним: низ, правая, левая, верх, торец.
function prism(P, near, depth, rTop, rSide = rTop, { cap = true, capR = null, topTex = null, sideTex = null } = {}) {
  const far = toward(near, depth);
  const face = (i) => { const j = (i + 1) % 4; return [near[i], near[j], far[j], far[i]]; };
  poly(P, face(2), rSide, { round: 1.5, bias: -0.55, grad: 0, tex: sideTex });
  poly(P, face(1), rSide, { round: 1.5, bias: -0.3, grad: 0.1, tex: sideTex });
  poly(P, face(3), rSide, { round: 1.5, bias: 0.05, grad: 0.1, tex: sideTex });
  poly(P, face(0), rTop, { round: 3, bias: -0.02, grad: 0.3, tex: topTex });
  if (cap) poly(P, near, capR || rSide, { round: 3, bias: -0.25, tex: rivets(7) });
  return far;
}

// Цилиндр в перспективе (ствол): от центра a радиуса r1 к центру b радиуса r2
function tube(P, a, b, r1, r2, rmp, { rings = 0, ringR = M.brass, mouth = true } = {}) {
  limb(P, a, b, r1, r2, rmp, { round: Math.max(2, r1 * 0.7), grad: 0 });
  for (let i = 1; i <= rings; i++) {
    const t = i / (rings + 1), c = lerp(a, b, t), r = r1 + (r2 - r1) * t;
    P.fill(P.mask().ellipse(c[0], c[1], r + 1, (r + 1) * 0.45).cut(P.mask().ellipse(c[0], c[1] - 2, r + 1, (r + 1) * 0.45)), ringR, { round: 1, contour: false });
  }
  if (mouth) {
    blob(P, b[0], b[1], r2, r2 * 0.5, M.iron, { round: 1.5, bias: 0.2 });
    blob(P, b[0], b[1], r2 * 0.6, r2 * 0.3, [hex('#050506'), hex('#0c0c10'), hex('#14141a'), hex('#1c1c22'), hex('#24242c')], { round: 1, contour: false });
  }
}

// Латная перчатка. side: 1 — правая (рукоять снизу справа), -1 — левая (под цевьём слева).
// Предплечье уходит за край кадра, кисть сжимает рукоять, пальцы-пластины загнуты.
function gauntlet(P, x, y, side, s = 1) {
  const edgeX = side > 0 ? W + 30 : -30;
  // предплечье: наруч из двух пластин
  P.fill(P.mask().poly([[x + side * 4 * s, y - 6 * s], [x + side * 18 * s, y - 14 * s], [edgeX, y + 18 * s], [edgeX, H + 40], [x + side * 4 * s, H + 40]]), M.glove, { round: 7, grad: 0.2 });
  P.fill(P.mask().limb(x + side * 22 * s, y - 12 * s, x + side * 12 * s, y + 22 * s, 3.2 * s), M.brass, { round: 2 }); // латунный обруч
  P.fill(P.mask().limb(x + side * 40 * s, y - 2 * s, x + side * 28 * s, y + 40 * s, 2.4 * s), M.brass, { round: 1.5 });
  P.fill(P.mask().poly([[x + side * 34 * s, y + 18 * s], [edgeX, y + 40 * s], [edgeX, H + 40], [x + side * 26 * s, H + 40]]), M.casing, { round: 5 }); // багровая ткань-подбой
  // тыльная сторона кисти
  P.fill(P.mask().poly([[x - side * 4 * s, y - 14 * s], [x + side * 14 * s, y - 16 * s], [x + side * 18 * s, y + 8 * s], [x - side * 2 * s, y + 12 * s]]), M.glove, { round: 5 });
  P.fill(P.mask().ellipse(x + side * 6 * s, y - 2 * s, 7 * s, 5 * s, side * -0.3), M.brass, { round: 2 }); // накладка
  // пальцы: 4 загнутые пластины вдоль рукояти
  for (let k = 0; k < 4; k++) {
    const fx = x - side * (9 - k * 0.5) * s, fy = y - 12 * s + k * 7 * s;
    P.fill(P.mask().ellipse(fx, fy, 6.5 * s, 3.8 * s, side * 0.15), M.glove, { round: 2.5, bias: 0.1 });
    P.set(fx - side * 2 * s, fy - 2 * s, hex('#e4ecf6'));
  }
  // большой палец сверху
  P.fill(P.mask().limb(x + side * 2 * s, y - 14 * s, x - side * 10 * s, y - 20 * s, 4.5 * s, 3.5 * s), M.glove, { round: 2.5, bias: 0.15 });
}

// Гравировка-эмблема героя: меч в круге (своя)
function emblem(P, cx, cy) {
  P.fill(P.mask().ellipse(cx, cy, 6, 4.5).cut(P.mask().ellipse(cx, cy, 4, 2.8)), M.brass, { round: 1, contour: false });
  P.line(cx, cy - 6, cx, cy + 5, hex('#ffe9a0'));
  P.line(cx - 3, cy - 2, cx + 3, cy - 2, hex('#ffe9a0'));
}

// Полоски-вентиляция
const slits = (step, k = 1.1) => (x, y) => (y % step === 0 ? -k : y % step === 1 ? k * 0.5 : 0);
const rivets = (step) => (x, y) => (x % step === 0 && y % step === 0 ? 1.2 : 0);

// ---------- 1. Тяжёлая винтовка «Громовержец» (разрывные патроны) ----------
function drawRifle({ casingOut = false } = {}) {
  const P = new Pix(W, H);
  gauntlet(P, 58, 112, -1);                                                    // левая рука поддерживает снизу
  prism(P, [[56, 92], [70, 92], [72, 128], [58, 130]], 0.18, M.iron, M.iron, { sideTex: slits(5) }); // магазин сбоку
  // корпус: верх — багровый кожух, бока — сталь
  const far = prism(P, [[70, 122], [142, 122], [148, 176], [64, 176]], 0.55, M.casing, M.steel, { topTex: rivets(9), sideTex: slits(9, 0.6) });
  // латунные кромки верхней грани
  P.fill(P.mask().limb(70, 122, far[0][0], far[0][1], 1.4), M.brass, { round: 1 });
  P.fill(P.mask().limb(142, 122, far[1][0], far[1][1], 1.4), M.brass, { round: 1 });
  emblem(P, 106, 100);
  // верхний короб с прицелом
  prism(P, [[92, 76], [120, 76], [122, 90], [90, 90]], 0.35, M.iron, M.iron, { topTex: slits(4, 0.7) });
  P.fill(P.mask().rect(104, 36, 4, 8), M.steel, { round: 1 });
  P.set(105, 35, hex('#ff5030')); P.set(106, 35, hex('#ff5030'));
  // ствол с латунными кольцами
  tube(P, [106, 66], [103, 8], 13, 9, M.steel, { rings: 2 });
  // правая рука на рукояти
  gauntlet(P, 150, 122, 1);
  if (casingOut) {
    P.fill(P.mask().limb(150, 70, 160, 62, 3), M.brass, { round: 2 }); // вылетающая гильза
    for (let i = 0; i < 8; i++) P.set(98 + i * 2, 1 + (i % 2), [220, 220, 230], 110);
  }
  return P.outline();
}

// ---------- 2. Дробовик «Молот» ----------
function drawShotgun() {
  const P = new Pix(W, H);
  tube(P, [92, 82], [92, 14], 11, 8, M.iron, { rings: 2 });
  tube(P, [118, 82], [114, 14], 11, 8, M.iron, { rings: 2 });
  gauntlet(P, 66, 108, -1);
  prism(P, [[78, 92], [130, 92], [134, 108], [74, 108]], 0.25, M.leather, M.leather, { topTex: slits(3, 0.7) }); // цевьё
  const far = prism(P, [[70, 120], [142, 120], [150, 176], [62, 176]], 0.34, M.iron, M.iron, { sideTex: slits(8, 0.6) });
  P.fill(P.mask().poly([[86, 120], [126, 120], lerp([126, 120], VP, 0.34), lerp([86, 120], VP, 0.34)]), M.casing, { round: 3, bias: -0.05, grad: 0.3 });
  P.fill(P.mask().limb(70, 120, far[0][0], far[0][1], 1.4), M.brass, { round: 1 });
  P.fill(P.mask().limb(142, 120, far[1][0], far[1][1], 1.4), M.brass, { round: 1 });
  emblem(P, 106, 108);
  gauntlet(P, 154, 126, 1);
  return P.outline();
}

// ---------- 3. Плазменный излучатель «Звезда» ----------
function drawPlasma({ glow = 0 } = {}) {
  const P = new Pix(W, H);
  limb(P, [52, 84], [56, 132], 10, 10, M.cyan, { round: 5, bias: glow - 0.1, contour: false }); // колба с плазмой
  for (const yy of [82, 132]) blob(P, 54, yy, 12, 5, M.brass, { round: 2 });
  gauntlet(P, 62, 118, -1, 0.9);
  prism(P, [[68, 116], [146, 116], [152, 176], [62, 176]], 0.42, M.iron, M.steel, { topTex: rivets(10), sideTex: slits(7, 0.7) });
  for (let k = 0; k < 3; k++) poly(P, [[144 + k * 6, 86], [148 + k * 6, 86], [156 + k * 6, 120], [152 + k * 6, 120]], M.iron, { round: 1 }); // рёбра охлаждения
  emblem(P, 106, 92);
  // ствол из колец: тёмные кольца + светящиеся катушки
  for (let i = 0; i < 7; i++) {
    const y = 72 - i * 9, r = 17 - i * 1.4;
    blob(P, 105, y, r, r * 0.45, M.iron, { round: 2 });
    blob(P, 105, y - 4, r - 2, (r - 2) * 0.45, M.cyan, { round: 2, bias: glow + (i % 2) * 0.1, contour: false });
  }
  blob(P, 105, 8, 10, 4.5, M.iron, { round: 2 });
  blob(P, 105, 8, 6, 2.5, M.cyan, { round: 1, bias: 0.4 + glow, contour: false });
  gauntlet(P, 152, 124, 1);
  return P.outline();
}

// ---------- 4. Термокопьё (луч, огромный урон вблизи) ----------
function drawThermal({ hot = 0 } = {}) {
  const P = new Pix(W, H);
  limb(P, [30, 128], [78, 104], 15, 15, M.casing, { round: 6 });                   // топливный бак
  for (const t of [0.12, 0.88]) blob(P, 30 + 48 * t, 128 - 24 * t, 6, 16, M.brass, { round: 2 }, 1.05);
  gauntlet(P, 64, 120, -1, 0.85);
  prism(P, [[70, 118], [144, 118], [150, 176], [64, 176]], 0.4, M.casing, M.iron, { topTex: rivets(9), sideTex: slits(8, 0.6) });
  tube(P, [106, 92], [105, 34], 24, 19, M.steel, { rings: 2, mouth: false });       // ствол
  blob(P, 105, 30, 26, 10, M.iron, { round: 3 });                                    // раструб
  blob(P, 105, 29, 20, 7, M.steel, { round: 2, bias: -0.2 });
  blob(P, 105, 28, 14, 5, M.heat, { round: 3, bias: hot - 0.25, contour: false });
  blob(P, 105, 28, 6, 2, M.heat, { round: 2, bias: hot + 0.2, contour: false });
  emblem(P, 106, 128);
  if (hot > 0.3) for (let i = 0; i < 50; i++) P.set(86 + ((i * 37) % 38), 6 + ((i * 53) % 16), [255, 220, 160], 90); // марево
  gauntlet(P, 152, 126, 1);
  return P.outline();
}

// ---------- 5. Цепной клинок ----------
// hilt — точка рукояти, ang — направление лезвия, teeth — сдвиг зубьев (анимация), smear — шлейф удара
function drawChainblade({ hilt = [146, 138], ang = -2.12, len = 176, teeth = 0, smear = 0 } = {}) {
  const P = new Pix(W, H);
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx; // вдоль и поперёк лезвия
  const at = (t, o) => [hilt[0] + dx * t + nx * o, hilt[1] + dy * t + ny * o];

const $ = (id) => document.getElementById(id);
$('controlsHelp').innerHTML = isTouch
  ? 'Слева — стик движения, справа — свайп для обзора. Кнопки: огонь (можно вести пальцем), прыжок, рывок, удар клинком, граната, перезарядка/смена оружия.'
  : 'WASD — бег · мышь — обзор · ЛКМ — огонь · Пробел — прыжок · Shift — рывок<br>F или ПКМ — цепной клинок · G — граната · R — перезарядка · 1–5 или колесо — оружие · Esc — пауза';
$('screenText').textContent = 'Орден Железного Похода высадился у осквернённой площади. Очисти её от еретиков и сокруши их Колосса.';

function showScreen(title, sub, html, btn, restart = false) {
  $('screenTitle').textContent = title;
  $('screenSub').textContent = sub;
  $('screenText').innerHTML = html;
  $('screenBtn').textContent = btn;
  $('restartBtn').classList.toggle('hidden', !restart);
  screen.classList.remove('hidden');
}

function lockPointer() {
  if (isTouch) return;
  const p = renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
  if (p && p.catch) p.catch(() => {});
}

function startGame() {
  initAudio();
  G.enemies.clear();
  G.projectiles.clear();
  G.fx.clear();
  G.player.reset(G.level.playerStart);
  G.weapons.reset();
  G.pickups.reset();
  G.flow.reset();
  game.stats = { kills: 0 };
  game.elapsed = 0;
  resume();
}

function resume() {
  initAudio();
  game.state = 'playing';
  screen.classList.add('hidden');
  G.hud.show(true);
  $('touch').classList.toggle('hidden', !isTouch);
  G.input.reset();
  lockPointer();
}

function pause() {
  if (game.state !== 'playing') return;
  game.state = 'paused';
  G.input.reset();
  sfx.beam(false);
  if (document.pointerLockElement) document.exitPointerLock();
  showScreen('ПАУЗА', 'бой ждёт', '', 'ПРОДОЛЖИТЬ', true);
}

function fmtTime(t) { return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`; }

function endGame(won) {
  game.state = won ? 'won' : 'dead';
  G.input.reset();
  sfx.beam(false);
  $('touch').classList.add('hidden');
  if (document.pointerLockElement) document.exitPointerLock();
  const stats = `<div class="stats"><span>Время</span><b>${fmtTime(game.elapsed)}</b><span>Убито врагов</span><b>${game.stats.kills}</b><span>Секреты</span><b>${G.flow.secretFound ? 1 : 0} / 1</b></div>`;
  if (won) {
    sfx.victory();
    music.setIntensity(0);
    showScreen('ПЛОЩАДЬ ОЧИЩЕНА', 'уровень пройден', stats, 'ЕЩЁ РАЗ');
  } else {
    sfx.defeat();
    showScreen('ВЫ ПАЛИ', 'орден помнит', stats, 'ЗАНОВО');
  }
}

$('screenBtn').addEventListener('click', () => { if (game.state === 'paused') resume(); else startGame(); });
$('restartBtn').addEventListener('click', () => startGame());
$('menuBtn').addEventListener('click', () => pause());
$('menuBtn').addEventListener('touchend', (e) => { e.preventDefault(); pause(); });
document.getElementById('weaponIcon').addEventListener('touchend', (e) => { e.preventDefault(); G.weapons.cycle(1); });

// настройки
const bind = (id, key, parse = Number) => {
  const el = $(id);
  if (el.type === 'checkbox') el.checked = !!settings[key]; else el.value = settings[key];
  el.addEventListener('input', async () => {
    settings[key] = el.type === 'checkbox' ? el.checked : parse(el.value);
    if (key === 'gyro' && settings.gyro) { settings.gyro = await G.input.enableGyro(); el.checked = settings.gyro; }
    applySettings();
    saveSettings();
  });
};
bind('setSens', 'sens'); bind('setBtnSize', 'btnSize'); bind('setBtnAlpha', 'btnAlpha'); bind('setMusic', 'music'); bind('setGyro', 'gyro');

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement) game.wasLocked = true;
  else if (game.wasLocked && game.state === 'playing') pause();
});
renderer.domElement.addEventListener('click', () => { if (game.state === 'playing' && !document.pointerLockElement) lockPointer(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- Размер окна ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.userData.baseFov = w < h ? 92 : 76;
  camera.updateProjectionMatrix();
  // пиксельный слой: ~280 "пикселей" по высоте → оружие занимает ~45% кадра, пиксели крупные и чёткие
  overlay.height = 280;
  overlay.width = Math.round((280 * w) / h);
  G.fx.setScale(h * renderer.getPixelRatio());
}
window.addEventListener('resize', resize);
resize();

// ---------- Игровой цикл ----------
const clock = new THREE.Clock();
let pruneT = 0;

function update(dt) {
  const I = G.input, P = G.player;
  game.elapsed += dt;
  I.pollGamepad(dt);
  if (I.take('pause')) { pause(); return; }
  const look = I.consumeLook();
  P.look(look.x, look.y);
  const move = I.getMove();
  if (I.take('jump')) P.jump();
  if (I.take('dash')) P.dash(move);
  P.update(dt, move);
  for (const ev of P.events) {
    if (ev === 'step') sfx.step(); else if (ev === 'jump') sfx.jump(); else if (ev === 'land') sfx.land(); else if (ev === 'dash') sfx.dash();
    else if (ev === 'fall') G.hud.objectiveFlash('Пропасть! Возвращаю к последней точке.');
  }
  P.events.length = 0;
  P.applyCamera(camera, game.time);
  camera.updateMatrixWorld();
  G.weapons.update(dt, I, game.time);
  G.enemies.update(dt, game.time);
  G.projectiles.update(dt);
  G.pickups.update(dt, game.time);
  G.flow.update(dt);
  G.hud.update(dt);
  pruneT -= dt;
  if (pruneT <= 0) { pruneT = 2; G.enemies.prune(); }
  if (P.dead) endGame(false);
}

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  game.time += dt;
  if (game.state === 'playing') update(dt);
  else if (game.state === 'won' || game.state === 'dead') G.enemies.update(dt, game.time);
  G.level.update(dt, game.time);
  G.fx.update(dt, G.world, camera.position, game.time);
  G.player.applyCamera(camera, game.time);
  const fov = (camera.userData.baseFov || 76) * (camera.userData.fovK || 1);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  if (game.state === 'playing' || game.state === 'paused') G.weapons.draw(dt, game.time);
  else G.weapons.ctx.clearRect(0, 0, overlay.width, overlay.height);
}
G.player.reset(G.level.playerStart);
G.pickups.reset();
G.flow.reset();
G.hud.show(false);
frame();

// Для отладки из консоли браузера (например: __game.G.player.health = 999)
window.__game = { G, game, update, THREE, startGame };


})();
</script>
