<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#a9bcd6">
  <title>Iron Crusade</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js с CDN, фиксированная версия -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- 3D-сцена -->
  <div id="game"></div>
  <!-- Пиксельный слой поверх 3D: оружие в руках, кровь на экране -->
  <canvas id="overlay"></canvas>

  <!-- Интерфейс -->
  <div id="hud" class="hidden">
    <div id="damage"></div>
    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker"></div>

    <!-- Полоса задачи с портретом советника -->
    <div id="objective">
      <div class="advisorFrame"><canvas id="advisor" width="40" height="52"></canvas></div>
      <div id="objText"></div>
    </div>
    <div id="objShort"></div>
    <div id="banner"></div>
    <div id="pickupMsg"></div>

    <!-- Маркер цели и стрелка у края экрана -->
    <div id="marker"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 1 L23 12 L12 23 L1 12 Z" fill="#2a2016" stroke="#e8b840" stroke-width="2.5"/><path d="M12 7 L17 12 L12 17 L7 12 Z" fill="#e8b840"/></svg><span id="markerDist"></span></div>
    <div id="edgeArrow"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M16 3 L6 12 L16 21" fill="none" stroke="#2a1c0a" stroke-width="7" stroke-linejoin="miter"/><path d="M16 3 L6 12 L16 21" fill="none" stroke="#e8b840" stroke-width="4" stroke-linejoin="miter"/></svg></div>

    <!-- Элитный враг: полоса здоровья и имя сверху -->
    <div id="bossbar" class="hidden"><div class="bar"><div id="bossFill"></div><div id="bossLost"></div></div><div class="name" id="eliteName">КОЛОСС</div></div>

    <!-- Патроны: лаймовая иконка оружия в скобках -->
    <div id="ammoBox"><div class="bracket"><canvas id="weaponIcon" width="48" height="20"></canvas></div><div class="cnt"><div id="ammoText">30</div><div id="ammoRes">150</div></div></div>
    <!-- Гранаты -->
    <div id="grenBox"><span id="grenText">3</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="rgba(20,30,10,0.35)" stroke="#bbde03" stroke-width="1.5" stroke-opacity="0.6"/><circle cx="12" cy="13.5" r="5.5" fill="#bbde03"/><path d="M9.5 13.5h5M12 8.5v10M10 6.5h4v2h-4z" stroke="#2a3a06" stroke-width="1.2"/></svg></div>

    <!-- Нижняя панель: портрет, броня/здоровье числами и двумя полосами -->
    <div id="bottom">
      <div id="portraitBox"><canvas id="portrait" width="40" height="40"></canvas></div>
      <div id="numbers"><div id="armorNum">0</div><div id="healthNum">100</div></div>
      <svg id="blade" viewBox="0 0 150 40">
        <defs>
          <clipPath id="hpClip"><rect id="hpRect" x="0" y="0" width="150" height="40"/></clipPath>
          <clipPath id="arClip"><rect id="arRect" x="0" y="0" width="150" height="40"/></clipPath>
        </defs>
        <polygon points="1,8 118,8 148,20 118,32 1,32" fill="#14100e" fill-opacity="0.85" stroke="#3a3430" stroke-width="2"/>
        <rect x="5" y="11" width="112" height="7" fill="#1830c8" clip-path="url(#arClip)"/>
        <rect x="5" y="11" width="112" height="2" fill="#6a84ff" clip-path="url(#arClip)"/>
        <polygon points="5,22 117,22 135,26 117,29 5,29" fill="#d01a10" clip-path="url(#hpClip)"/>
        <rect x="5" y="22" width="112" height="2" fill="#ff6a50" clip-path="url(#hpClip)"/>
        <path d="M118 8 L148 20 L118 32" fill="none" stroke="#7a6a50" stroke-width="2"/>
      </svg>
      <div id="dashPip"></div>
    </div>
    <button id="menuBtn" aria-label="Меню"><i></i><i></i><i></i></button>
  </div>

  <!-- Сенсорное управление: маленькие контурные кнопки по краям -->
  <div id="touch" class="hidden">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div class="tbtn big" data-act="fire" id="btnFire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="2.4"/></svg></div>
    <div class="tbtn pict" data-act="jump" id="btnJump"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2.4" fill="currentColor"/><path d="M12 7l-4 4 3 2-2 6M12 7l3 4 4-1M11 13l5 1 1 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/><path d="M4 22h6" stroke="currentColor" stroke-width="1.6" opacity="0.6"/></svg></div>
    <div class="tbtn pict" data-act="dash" id="btnDash"><svg viewBox="0 0 24 24"><circle cx="15" cy="5" r="2.4" fill="currentColor"/><path d="M14 8l-3 5 4 2-1 6M14 8l5 3M11 13l-5 2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/><path d="M1 9h6M2 13h4M1 17h5" stroke="currentColor" stroke-width="1.6"/><path d="M19 4c3 3 3 9 0 13" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>
    <div class="tbtn pict" data-act="melee" id="btnMelee"><svg viewBox="0 0 24 24"><path d="M3 21l3-3M5 16l3 3M7 17L19 5l2-2-1 3L8 18" fill="currentColor" stroke="currentColor" stroke-width="1.6"/><path d="M9 13l1 1M11 11l1 1M13 9l1 1M15 7l1 1" stroke="#22300a" stroke-width="1.2"/></svg></div>
    <div class="tbtn ghost" data-act="grenade" id="btnGrenade"></div>
    <div class="tbtn ghost" data-act="reload" id="btnReload"></div>
  </div>

  <!-- Экраны: меню, пауза с настройками, смерть, завершение -->
  <div id="screen" class="overlay">
    <div class="panel">
      <h1 id="screenTitle">IRON CRUSADE</h1>
      <p id="screenSub">прототип</p>
      <div id="screenText"></div>
      <div class="buttons">
        <button id="screenBtn">В БОЙ</button>
        <button id="restartBtn" class="ghost hidden">ЗАНОВО</button>
      </div>
      <details id="settings">
        <summary>Настройки</summary>
        <label>Чувствительность обзора <input id="setSens" type="range" min="0.3" max="2.5" step="0.05"></label>
        <label>Размер кнопок <input id="setBtnSize" type="range" min="0.7" max="1.5" step="0.05"></label>
        <label>Прозрачность кнопок <input id="setBtnAlpha" type="range" min="0.2" max="1" step="0.05"></label>
        <label class="check"><input id="setMusic" type="checkbox"> Музыка</label>
        <label class="check"><input id="setGyro" type="checkbox"> Гироскоп (наклон телефона двигает прицел)</label>
      </details>
      <p id="controlsHelp"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
